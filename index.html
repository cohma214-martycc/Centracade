  shareCard(){ this.state='sharecard'; this.overAt=performance.now(); this.cardCapture=true; },
  tryShareCanvas(){
    try{
      if(c.toBlob&&navigator.canShare){
        c.toBlob(b=>{ try{ const f=new File([b],'tuckshoprun.png',{type:'image/png'}); if(navigator.canShare({files:[f]})) navigator.share({files:[f]}).catch(()=>{}); }catch(e){} },'image/png');
      }
    }catch(e){}
  },
  copyRect(){ return {x:34,y:H-104,w:132,h:36}; },
  shareRect(){ return {x:W-166,y:H-104,w:132,h:36}; },
  drawBtn(r,label,pal){
    rr(r.x,r.y,r.w,r.h,8); ctx.fillStyle=pal.acc+'55'; ctx.fill();
    ctx.strokeStyle=pal.ring; ctx.lineWidth=2; rr(r.x,r.y,r.w,r.h,8); ctx.stroke();
    ctx.textAlign='center'; ctx.font='8px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.fillText(label,r.x+r.w/2,r.y+r.h/2+3);
  },
  update(dt){ if(this.state==='playing'&&cur) cur.update(dt); },
  render(){
    if(this.state==='playing'&&cur){ cur.render(); this.drawStrip(); }
    else if(this.state==='interstitial') this.drawInterstitial();
    else if(this.state==='sharecard') this.drawSharecard();
    else if(this.state==='end') this.drawDailyEnd();
  },
  tap(x,y){
    if(this.state==='playing'&&cur){ cur.tap(x,y); return; }
    if(this.state==='sharecard'){ this.state='end'; this.overAt=performance.now(); return; }
    if(performance.now()-this.overAt<=450) return; // debounce
    if(this.state==='interstitial'){ this.advance(); return; }
    if(this.state==='end'){
      if(!this.forfeited()){
        if(inR(x,y,this.copyRect())){ this.shareGrid(); return; }
        if(inR(x,y,this.shareRect())){ this.shareCard(); return; }
      }
      this.exit();
    }
  },
  drawStrip(){
    ctx.save(); ctx.textAlign='center';
    ctx.font='6px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.fillText(DAILY_NAME+' '+(this.idx+1)+'/'+this.order.length+'  ·  '+this.total,W/2,30);
    ctx.restore();
  },
  drawBars(results,y0,rowH,withRank){
    const bx=44, bw=W-88;
    results.forEach((r,i)=>{
      const y=y0+i*rowH;
      ctx.textAlign='left'; ctx.font='6px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.fillText(r.name,bx,y-4);
      ctx.textAlign='right'; ctx.fillStyle=r.pal.ring; ctx.fillText(''+r.contrib,bx+bw,y-4);
      rr(bx,y,bw,7,3); ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fill();
      rr(bx,y,bw*Math.max(0.02,Math.min(1,r.contrib/this.CAP)),7,3); ctx.fillStyle=r.pal.ring; ctx.fill();
      if(withRank){ ctx.textAlign='left'; ctx.font='5px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fillText(r.rank,bx,y+16); }
    });
  },
  drawInterstitial(){
    const p=PALS[2]; drawBG(p); drawFX();
    const r=this.results[this.results.length-1];
    ctx.textAlign='center';
    ctx.font='8px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillText('GAUNTLET',W/2,58);
    ctx.font='14px "Press Start 2P"'; ctx.fillStyle=r.pal.ring; ctx.shadowColor=r.pal.glow; ctx.shadowBlur=12;
    ctx.fillText(r.name,W/2,94); ctx.shadowBlur=0;
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillText('SCORE '+r.score+'   →   +'+r.contrib,W/2,116);
    ctx.font='8px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillText('RUNNING TOTAL',W/2,148);
    ctx.font='30px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=16; ctx.fillText(this.total,W/2,188); ctx.shadowBlur=0;
    this.drawBars(this.results,232,30,false);
    ctx.textAlign='center';
    ctx.font='6px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fillText('NEXT  ·  '+this.order[this.idx+1].name,W/2,H-70);
    ctx.globalAlpha=0.55+0.45*Math.sin(tick*0.09);
    ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.fillText('► TAP TO CONTINUE',W/2,H-44);
    ctx.globalAlpha=1;
  },
  drawDailyEnd(){

const PER_PAGE=4;

function menuCards(){
  if(menuPage===0) return []; // page 0 is the daily tile only
  const cw=158, chh=164, gx=15, gy=190, gapX=14, gapY=16;
  const start=(menuPage-1)*PER_PAGE;

  for(let i=start;i<Math.min(start+PER_PAGE,GAMES.length);i++){

    cards.push({g:GAMES[i], x:gx+(j%2)*(cw+gapX), y:gy+Math.floor(j/2)*(chh+gapY), w:cw, h:chh});

}
function menuNav(){

    dots, y,

    if(nav.right) drawArrow(nav.right,1);
  }
  ctx.font='5px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.fillText('PAYMENTS BY CENTRAPAY',W/2,H-32);
  drawMark(W/2,H-17,14,'rgba(245,236,224,0.5)');
}

// ── Frame loop ───────────────────────────────────────────────────
function drawPauseOverlay(){
  ctx.fillStyle='rgba(4,2,8,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='12px "Press Start 2P"'; ctx.fillStyle='#fff';
  ctx.shadowColor=PALS[2].glow; ctx.shadowBlur=14;
  ctx.fillText('PAUSED',W/2,H/2-20); ctx.shadowBlur=0;
  ctx.globalAlpha=0.55+0.45*Math.sin(tick*0.08);
  ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#fff';
  ctx.fillText('► TAP TO RESUME',W/2,H/2+16);
  ctx.globalAlpha=1;
}
function frame(t){
  const dt=Math.min(0.05,(t-lastT)/1000||0.016);
  lastT=t;
  tick++;
  updateFX();
  // Telemetry (6.0): record each game's play→over transition once, for free play
  // AND the daily (cur is the running game in both). 'ready'/no-cur resets the
  // timer between runs, so a tap-to-restart re-arms cleanly.
  if(cur){
    if(cur.st==='play'){ if(telemStartAt==null) telemStartAt=performance.now(); }
    else if(cur.st==='over'){ if(telemStartAt!=null){ recordGameStat(cur.id,Math.floor(cur.score||0),(performance.now()-telemStartAt)/1000,mode==='gauntlet'); telemStartAt=null; } }
    else telemStartAt=null;
  } else telemStartAt=null;
  if(mode!==lastMode){ if(mode==='menu') dumpStats(); lastMode=mode; } // dump arc_stats on menu entry
  if(mode==='game'&&cur){
    if(!paused) cur.update(dt);
    cur.render();
    if(paused) drawPauseOverlay();
    drawChrome(true);
  } else if(mode==='gauntlet'){
    if(!paused) GAUNTLET.update(dt);
    GAUNTLET.render();
    if(paused) drawPauseOverlay();
    if(GAUNTLET.state!=='sharecard') drawChrome(true); // keep the share card clean
  } else {
    drawMenu();
    drawChrome(false);
  }
  requestAnimationFrame(frame);
}
// Freeze play when the tab is backgrounded; require a tap to resume on return.
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) return;
  if(mode==='game' && cur && cur.st==='play') paused=true;
  else if(mode==='gauntlet' && GAUNTLET.state==='playing' && cur && cur.st==='play') paused=true;
});

// ── Input ────────────────────────────────────────────────────────
function getXY(e){
  const r=c.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};
}
// Game input fires immediately on pointerdown (zero latency for rhythm taps).
// Menu selection resolves on pointerup so a horizontal drag reads as a page swipe.
let menuDrag=null;
// Optional pointer-stream contract (§3, D12). A game opts in by defining press();
// then the router forwards press/drag/release and does NOT call tap() during play.
// Games without press() are untouched — tap() on pointerdown, exactly as before.
// gameGesture holds the live gesture: {x,y} = last coords, live = in-play (press
// fired) vs a ready/over interaction that resolves through tap() on release.
// Kept strictly separate from menuDrag (menu and game modes never coexist).
let gameGesture=null;
function gameDown(x,y){
  if(cur.press){
    if(cur.st==='play'){ cur.press(x,y); gameGesture={x,y,live:true}; }
    else gameGesture={x,y,live:false}; // ready-start / over-restart → tap() on release
  } else {
    cur.tap(x,y); // no stream declared: unchanged tap-on-pointerdown
  }
}
function onDown(e){
  e.preventDefault();
  audio();
  const {x,y}=getXY(e);
  if(inR(x,y,muteRect())){ mute=!mute; try{ localStorage.setItem('arc_mute',mute?'1':'0'); }catch(err){} return; }
  if(mode==='game'){
    if(inR(x,y,homeRect())){ mode='menu'; cur.init(); cur=null; paused=false; gameGesture=null; refreshMenuBests(); refreshDaily(); return; }
    if(paused){ paused=false; return; } // consume the resume tap
    gameDown(x,y);
    return;
  }
  if(mode==='gauntlet'){
    if(inR(x,y,homeRect())){ GAUNTLET.exit(); gameGesture=null; return; }
    if(paused){ paused=false; return; }
    if(GAUNTLET.state==='playing'&&cur){ gameDown(x,y); return; } // stream/tap the running game
    GAUNTLET.tap(x,y); // interstitial / end / sharecard chrome
    return;
  }
  menuDrag={x0:x,y0:y,moved:false}; // menu: defer to pointerup
}
function onMove(e){
  if(gameGesture){ // a game pointer-stream gesture owns the pointer
    if(gameGesture.live){ const {x,y}=getXY(e); if(cur&&cur.drag) cur.drag(x,y); gameGesture.x=x; gameGesture.y=y; }
    return;
  }
  if(!menuDrag||mode!=='menu') return;
  if(Math.abs(getXY(e).x-menuDrag.x0)>8) menuDrag.moved=true;
}
function onUp(e){
  if(gameGesture){
    const {x,y}=getXY(e);
    if(gameGesture.live){ if(cur&&cur.release) cur.release(x,y); } // gesture end
    else if(cur) cur.tap(x,y); // ready-start / over-restart (shared debounce + screens)
    gameGesture=null;
    return;
  }
  if(mode!=='menu'||!menuDrag){ menuDrag=null; return; }
  const {x,y}=getXY(e), dx=x-menuDrag.x0, moved=menuDrag.moved, n=menuPageCount();
  menuDrag=null;
  if(moved){ // swipe left/right between pages
    if(dx<=-40&&menuPage<n-1){ menuPage++; sTick(0.02); }
    else if(dx>=40&&menuPage>0){ menuPage--; sTick(0.02); }
    return;
  }
  const nav=menuNav();
  if(nav.left&&inR(x,y,nav.left)){ menuPage--; sTick(0.02); return; }
  if(nav.right&&inR(x,y,nav.right)){ menuPage++; sTick(0.02); return; }
  for(const d of nav.dots){ if(Math.hypot(x-d.x,y-d.y)<=d.r){ menuPage=d.page; sTick(0.02); return; } }
  if(menuPage===0){ if(inR(x,y,dailyTileRect())){ GAUNTLET.beginDaily(); sHit(); } return; } // page 0 = daily tile
  for(const card of menuCards()){
    if(x>=card.x&&x<=card.x+card.w&&y>=card.y&&y<=card.y+card.h){
      cur=card.g; cur.onOver=null; cur.srng=null; cur.init(); mode='game'; paused=false; sHit(); return;
    }
  }
}
c.addEventListener('pointerdown',onDown);
c.addEventListener('pointermove',onMove);
c.addEventListener('pointerup',onUp);
c.addEventListener('pointercancel',()=>{
  if(gameGesture){ // iOS fires this on interruption — terminate the gesture cleanly (§3)
    if(gameGesture.live&&cur&&cur.release) cur.release(gameGesture.x,gameGesture.y);
    gameGesture=null;
    return;
  }
  menuDrag=null;
});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(paused){ paused=false; return; }
    // Keyboard is convenience-only: route space only to positionless games.
    const inGame = mode==='game' || (mode==='gauntlet'&&GAUNTLET.state==='playing');
    if(inGame&&cur&&cur.spaceTap) cur.tap();
  } else if(mode==='menu'&&(e.code==='ArrowLeft'||e.code==='ArrowRight')){
    e.preventDefault();
    if(e.code==='ArrowLeft'&&menuPage>0) menuPage--;
    if(e.code==='ArrowRight'&&menuPage<menuPageCount()-1) menuPage++;
  }
});

// Wait for the pixel font before the first frame to kill the FOUT,
// but never block longer than the timeout fallback.
let loopStarted=false;
function startLoop(){ if(!loopStarted){ loopStarted=true; requestAnimationFrame(frame); } }
if(document.fonts&&document.fonts.load){
  Promise.race([
    document.fonts.load('8px "Press Start 2P"').catch(()=>{}),
    new Promise(r=>setTimeout(r,1500))
  ]).then(startLoop);
} else {
  startLoop();
}
</script>
</body>
</html>
