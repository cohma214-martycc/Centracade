    this.newBest=false; this.st='ready'; this.overAt=0;
    parts=[]; pops=[];
  },
  pal(){ return PALS[5]; }, // amber accents; the schoolyard court is drawn grey below
  mult(){ return 1+this.loop; },
  start(){ this.st='play'; this.gapT=0.5; },
  rungCfg(){ return this.RUNGS[this.rung]; },
  launchToss(){
    const cfg=this.rungCfg(), total=cfg.c+cfg.s;
    const spd=this.baseSpd*cfg.spd, lv=this.BASE_LV*spd, g=this.BASE_G*spd*spd;
    const slots=this.SLOTS.slice();
    for(let i=slots.length-1;i>0;i--){ const j=(srnd(this)*(i+1))|0; const t=slots[i]; slots[i]=slots[j]; slots[j]=t; }
    const roles=[];
    for(let i=0;i<cfg.c;i++) roles.push('catch');
    for(let i=0;i<cfg.s;i++) roles.push('skip');
    for(let i=roles.length-1;i>0;i--){ const j=(srnd(this)*(i+1))|0; const t=roles[i]; roles[i]=roles[j]; roles[j]=t; }
    this.bones=[];
    for(let i=0;i<total;i++){
      this.bones.push({x:slots[i], y:this.CATCH_LINE, vy:-lv, vx:(Math.random()-0.5)*16, g,
        kind:roles[i], caught:false, landed:false, delay:i*0.08, flip:false, seed:(Math.random()*6)|0});
    }
    this.tossActive=true; this.tossFault=false;
    beep(700,0.05,'square',0.03);
  },
  drop(b,label){
    this.tossFault=true; this.drops++;
    burst(b.x,this.CATCH_LINE,'#ff4455',14,3.5);
    pop(label,b.x,this.CATCH_LINE-24,'#ff6a8a',6);
    sBad(); buzz(45); this.shake=Math.max(this.shake,5);
    if(this.drops>=3) this.over();
  },
  onLand(b){
    if(b.kind==='catch'&&!b.caught) this.drop(b,'DROP!');
    else if(b.kind==='skip') sTick(0.02); // leaving a grey bone is correct
  },
  resolveToss(){
    this.tossActive=false;
    if(!this.tossFault){
      this.score+=5*this.mult();
      pop('+'+(5*this.mult()),W/2,300,'#ffd24a',6);
      this.tossClears++;
      if(this.tossClears>=this.CLEARS_PER_RUNG) this.rungUp();
    }
    const si=Math.floor(this.score);
    if(si>this.best){ this.best=si; this.newBest=true; saveBest(this.bestKey,this.best); }
    this.gapT=this.TOSS_GAP;
  },
  rungUp(){
    this.tossClears=0;
    this.baseSpd*=1.04; // R5: time-ramp — every rung-up nudges speed up
    if(this.rung>=this.LADDER.length-1){
      this.loop++; this.rung=0; this.baseSpd*=1.04; // extra bump on loop (≈×1.08 total)
      this.banner={t:'LOOP ×'+this.mult()+'!',life:1.6}; sGold();
    } else {
      this.rung++;
      this.banner={t:this.LADDER[this.rung]+'!',life:1.5}; sStage();
    }
    this.timeScale=0.4; buzz(30); this.shake=5;
    burst(W/2,300,this.pal().glow,20,4.5);
  },
  over(){
    this.st='over'; this.overAt=performance.now(); this.tossActive=false;
    sBad(); buzz(70); this.shake=10;
    if(this.onOver) this.onOver();
  },
  update(dt){
    this.timeScale+=(1-this.timeScale)*0.055;
    this.shake*=0.82;
    if(this.st==='play'){
      const ts=this.timeScale;
      if(this.gapT>0){ this.gapT-=dt*ts; if(this.gapT<=0&&!this.tossActive) this.launchToss(); }
      this.bones.forEach(b=>{
        if(b.caught||b.landed) return;
        if(b.delay>0){ b.delay-=dt*ts; return; }
        b.vy+=b.g*dt*ts; b.y+=b.vy*dt*ts; b.x+=b.vx*dt*ts;
        if((tick+b.seed)%6===0) b.flip=!b.flip; // spin frame-flip
        if(b.vy>0&&b.y>=this.CATCH_LINE){ b.y=this.CATCH_LINE; b.landed=true; this.onLand(b); }
      });
      if(this.tossActive&&this.bones.length>0&&this.bones.every(b=>b.caught||b.landed)) this.resolveToss();
    }
    if(this.banner){ this.banner.life-=0.016; if(this.banner.life<=0) this.banner=null; }
  },
  drawCourt(){
    const y=this.CATCH_LINE;
    const g=ctx.createLinearGradient(0,y,0,H);
    g.addColorStop(0,'#3a3a40'); g.addColorStop(1,'#242428');
    ctx.fillStyle=g; ctx.fillRect(0,y,W,H-y);
    ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(0,y,W,2);
    ctx.fillStyle='rgba(255,255,255,0.05)';
    for(let i=0;i<40;i++){ const rx=(i*97)%W, ry=y+8+((i*53)%(H-y-10)); ctx.fillRect(rx,ry,2,2); }
    ctx.save(); ctx.setLineDash([8,7]); ctx.strokeStyle='rgba(240,236,224,0.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.restore();
    ctx.strokeStyle='rgba(240,236,224,0.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(W/2,H-58,64,20,0,0,Math.PI*2); ctx.stroke();
  },
  drawShadow(b){
    const h=Math.max(0,this.CATCH_LINE-b.y), s=Math.max(0.3,1-h/300);
    ctx.save(); ctx.globalAlpha=0.25*s; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(b.x,this.CATCH_LINE+8,11*s,4*s,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  },
  drawBone(b){
    const catchB=b.kind==='catch';
    ctx.save(); ctx.translate(b.x,b.y); ctx.scale(b.flip?-1:1,1);
    const col=catchB?'#f0e6d0':'#8f887c';
    if(catchB){ ctx.shadowColor='#ffd24a'; ctx.shadowBlur=10; }
    ctx.fillStyle='#140f0a'; rr(-9,-5,18,10,4); ctx.fill();
    [[-8,-4],[-8,4],[8,-4],[8,4]].forEach(k=>{ ctx.beginPath(); ctx.arc(k[0],k[1],3.4,0,Math.PI*2); ctx.fill(); });
    ctx.shadowBlur=0;
    ctx.fillStyle=col; rr(-7,-4,14,8,3); ctx.fill();
    [[-8,-4],[-8,4],[8,-4],[8,4]].forEach(k=>{ ctx.beginPath(); ctx.arc(k[0],k[1],2.6,0,Math.PI*2); ctx.fill(); });
    ctx.fillStyle='rgba(255,255,255,0.28)'; rr(-6,-3,12,2.5,2); ctx.fill();
    ctx.fillStyle=catchB?'#ffb020':'#5a564e'; ctx.fillRect(-1.5,-1.5,3,3);
    ctx.restore();
  },
  drawRestingBones(){
    const cy=H-58;
    [[-40,2,0],[-14,-6,1],[12,4,2],[38,-2,3],[0,10,4]].forEach(o=>{
      this.drawBone({x:W/2+o[0],y:cy+o[1],kind:o[2]<3?'catch':'skip',flip:(o[2]%2===0)});
    });
  },
  render(){
    const p=this.pal();
    ctx.save();
    if(this.shake>0.4) ctx.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake*0.7);
    drawBG(p);
    this.drawCourt();
    if(this.st==='ready') this.drawRestingBones();
    else {
      this.bones.forEach(b=>{ if(!b.caught) this.drawShadow(b); });
      this.bones.forEach(b=>{ if(!b.caught) this.drawBone(b); });
    }
    drawFX();
    // HUD
    ctx.textAlign='center';
    ctx.font='26px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=14; ctx.fillText(Math.floor(this.score),W/2,76); ctx.shadowBlur=0;
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fillText('BEST '+this.best,W/2,96);
    for(let i=0;i<3;i++){ const lx=W/2-26+i*26; ctx.save(); ctx.globalAlpha=i<(3-this.drops)?1:0.18;
      ctx.translate(lx,110); ctx.fillStyle='#f0e6d0'; rr(-7,-3,14,6,3); ctx.fill();
      [[-6,-3],[-6,3],[6,-3],[6,3]].forEach(k=>{ ctx.beginPath(); ctx.arc(k[0],k[1],2.4,0,Math.PI*2); ctx.fill(); });
      ctx.restore(); }
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='#ffd24a'; ctx.shadowColor='#ffaa00'; ctx.shadowBlur=6;
    ctx.fillText(this.LADDER[this.rung]+(this.loop>0?' ×'+this.mult():''),W/2,128); ctx.shadowBlur=0;
    ctx.font='5px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.fillText('CLEARS '+this.tossClears+'/'+this.CLEARS_PER_RUNG,W/2,140);
    if(this.banner){
      const b=this.banner, a2=Math.min(1,b.life*2), scale=1+(1-Math.min(1,b.life*1.6))*0.25;
      ctx.save(); ctx.globalAlpha=a2; ctx.translate(W/2,168); ctx.scale(scale,scale);
      ctx.font='11px "Press Start 2P"'; ctx.textAlign='center';
      ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=16; ctx.fillText(b.t,0,0);
      ctx.restore();
    }
    ctx.restore();
    if(this.st==='ready') drawReadyScreen(p,'KNUCKLEBONES',['TAP THE GOLD BONES IN THE AIR','CATCH THEM BEFORE THEY LAND','GREY BONES: LEAVE THEM BE',"3 DROPS AND YOU'RE OUT"]);
    if(this.st==='over') drawOverScreen(p,'BONES DROPPED',Math.floor(this.score),this.best,this.newBest,this.LADDER[this.rung]+(this.loop>0?' ×'+this.mult():''),'LOOP '+(this.loop+1)+' · '+this.catches+' CAUGHT');
  },
  tap(x,y){
    if(this.st==='ready'){ this.start(); return; }
    if(this.st==='over'){
      if(performance.now()-this.overAt>450){ this.init(); this.start(); }
      return;
    }
    let best=null, bd=1e9;
    this.bones.forEach(b=>{
      if(b.caught||b.landed||b.delay>0) return;
      const d=Math.hypot(x-b.x,y-b.y);
      if(d<this.CATCH_R&&d<bd){ best=b; bd=d; }
    });
    if(!best) return; // an empty grab is a harmless no-op
    if(best.kind==='catch'){
      best.caught=true; this.catches++; this.score+=2*this.mult();
      const si=Math.floor(this.score); if(si>this.best){ this.best=si; this.newBest=true; saveBest(this.bestKey,this.best); }
      burst(best.x,best.y,'#ffd24a',8,2.6); pop('CLICK',best.x,best.y-18,'#ffd24a',6); sHit(); buzz(10);
    } else {
      best.landed=true; this.drop(best,'FAULT!'); // tapping a grey bone is a fault
    }
  }
};

// ════════════════════════════════════════════════════════════════
//  GAME 7: GUNGE  (Phase 5.2 — the gunge-tank pipe puzzle)
//  Verb: tap-to-rotate. The hub's only puzzle — think under a clock,
//  don't react. Tap a 5×5 pipe tile to rotate it 90°; connect the
//  top valve to the bottom tank, then hit the drawn RELEASE valve to
//  let the neon gunge flow. Tap-only (no press()) — stays on tap()
//  per D12/§3. Joins the daily (D11); endless + 3 lives (D14).
//
//  D16 — the board is generated correct-by-construction, never
//  generate-and-hope. genBoard(): carve ONE simple source→dest path
//  (randomised DFS), assign each path cell the SHAPE its two
//  connections require (straight or elbow — always a 2-opening tile,
//  so a solved path never branches into a decoy and cannot leak),
//  drop random decoy tiles in the rest, then scramble ONLY rotations.
//  Every shape's solving orientation is one of its 4 rotations, so a
//  solution provably exists after any scramble — a shared unsolvable
//  daily board is structurally impossible. All draws route through
//  srnd(this): daily is reproducible, free play uses Math.random.
//
//  RELEASE valve (D17) — remaining time only banks as score if you
//  commit early. Outcome matrix:
//    release,       solved     → score += remaining × segments, advance
//    release,       mis-solved → leak, lose a life
//    auto-release@0, solved     → gunge lands, 0 points, NO life lost
//    auto-release@0, mis-solved → leak, lose a life
//  ("solved" = gunge reaches the tank cleanly with no spill. Segments
//  is fixed by the generated path, so the gamble is time-vs-commit,
//  not "did I misread my pipes" — connected pipes are lit from the
//  source so the board is always readable. The valve sits well clear
//  of the grid at the bottom (DAIRY-button style); tapping it can
//  cost a life, but §8 holds — stray taps elsewhere are free no-ops,
//  and there is no confirm dialog: the snap decision is the point.)
// ════════════════════════════════════════════════════════════════
const GUNGE={
  id:'gunge', name:'GUNGE', tag:'CONNECT THE PIPES',
  bestKey:'arc_gunge_best',
  par:300, // PROVISIONAL — pure guess against remaining×segments; instrument early
  ranks:[{s:0,t:'STUDIO AUDIENCE'},{s:150,t:'BUCKET CATCHER'},{s:400,t:'PIPE PLUMBER'},{s:800,t:'VALVE MASTER'},{s:1400,t:'GUNGE TANK LEGEND'}], // PROVISIONAL
  GX:30, GY:150, GRID_PX:300,           // grid box (logical px); cell size derives from N
  TIME_BASE:48, TIME_STEP:3.6, TIME_FLOOR:21, // per-board countdown (s) — PROVISIONAL (3× the original 16/1.2/7 — owner asked for more solve time)
  FILL_STEP:0.055,                      // seconds per cell of the release animation
  PW:0.30,                              // pipe width as a fraction of the cell
  // Direction bits: N=1 E=2 S=4 W=8. Shapes (base masks): straight 5, elbow 3, tee 7, dead 1.
  DIRS:[1,2,4,8],
  init(){
    this.N=5; this.cell=this.GRID_PX/this.N;
    this.lives=3; this.score=0; this.stage=0;
    this.phase='build';           // 'build' (rotating) | 'flow' (gunge propagating)
    this.result=null; this.fillN=0; this.stopN=0; this.flowT=0;
    this.shake=0; this.banner=null; this.rejectAt=0;
    this.best=loadBest(this.bestKey);
    this.newBest=false; this.st='ready'; this.overAt=0;
    parts=[]; pops=[];
    this.genBoard();
  },
  pal(){ return PALS[6]; }, // slime lime
  start(){ this.st='play'; },
  // ── geometry helpers ──
  nbIdx(idx,bit){
    const N=this.N; let c=idx%N, r=(idx/N)|0;
    if(bit===1) r--; else if(bit===4) r++; else if(bit===2) c++; else c--;
    return (c<0||c>=N||r<0||r>=N) ? -1 : r*N+c;
  },
  opp(bit){ return bit===1?4:bit===4?1:bit===2?8:2; },
  rotCW(m){ return ((m<<1)|(m>>3))&15; },
  rotMask(shape,r){ let m=shape; for(let i=0;i<(r&3);i++) m=this.rotCW(m); return m; },
  dirBit(from,to){ // bit on 'from' pointing at adjacent 'to'
    const N=this.N, d=to-from;
    if(d===-N) return 1; if(d===N) return 4; if(d===1) return 2; return 8;
  },
  shapeFor(mask){ return (mask===5||mask===10) ? 5 : 3; }, // 2 collinear bits → straight, else elbow
  // ── D16 board generation: solved-then-scrambled ──
  carve(src,dst){ // randomised DFS → one simple path src→dst
    const N=this.N, seen=new Array(N*N).fill(false), path=[], self=this;
    function dfs(idx){
      seen[idx]=true; path.push(idx);
      if(idx===dst) return true;
      const ds=self.DIRS.slice();
      for(let i=ds.length-1;i>0;i--){ const j=Math.floor(srnd(self)*(i+1)); const t=ds[i]; ds[i]=ds[j]; ds[j]=t; }
      for(let k=0;k<ds.length;k++){ const n=self.nbIdx(idx,ds[k]); if(n>=0&&!seen[n]&&dfs(n)) return true; }
      path.pop(); seen[idx]=false; return false;
    }
    dfs(src);
    return path;
  },
  genBoard(){
    const N=this.N=(this.stage>=3?6:5);
    this.cell=this.GRID_PX/N;
    const src=Math.floor(srnd(this)*N);              // source on the top edge (valve inlet from N)
    const dst=(N-1)*N+Math.floor(srnd(this)*N);      // dest on the bottom edge (tank outlet to S)
    this.srcIdx=src; this.dstIdx=dst;
    const path=this.carve(src,dst);
    const mask=new Array(N*N).fill(0);
    for(let i=0;i<path.length;i++){
      const idx=path[i]; let m=0;
      if(i>0) m|=this.dirBit(idx,path[i-1]);
      if(i<path.length-1) m|=this.dirBit(idx,path[i+1]);
      if(idx===src) m|=1;   // valve inlet
      if(idx===dst) m|=4;   // tank outlet
      mask[idx]=m;
    }
    const decoy=[5,3,7,1];
    this.tiles=new Array(N*N);
    for(let idx=0;idx<N*N;idx++){
      const shape = mask[idx] ? this.shapeFor(mask[idx]) : decoy[Math.floor(srnd(this)*decoy.length)];
      this.tiles[idx]={shape, r:0, path:!!mask[idx]};
    }
    for(let idx=0;idx<N*N;idx++) this.tiles[idx].r=Math.floor(srnd(this)*4); // scramble rotations ONLY
    this.timeLeft=this.stageTime();
    this.phase='build'; this.result=null; this.fillN=0; this.flowT=0;
    this.recompute();
  },
  stageTime(){ return Math.max(this.TIME_FLOOR, this.TIME_BASE-this.stage*this.TIME_STEP); },
  // ── connectivity: flood from the source through matching openings ──
  flow(){
    const N=this.N, src=this.srcIdx, dst=this.dstIdx;
    const open=idx=>this.rotMask(this.tiles[idx].shape,this.tiles[idx].r);
    const lit=new Array(N*N).fill(false), order=[];
    let leaked=false, leakCell=-1;
    if(open(src)&1){                                   // gunge only enters if the source accepts the valve
      const q=[src]; lit[src]=true;
      while(q.length){
        const idx=q.shift(); order.push(idx); const om=open(idx);
        for(let d=0;d<4;d++){ const b=this.DIRS[d]; if(!(om&b)) continue;
          const n=this.nbIdx(idx,b);
          if(n<0){ const legit=(idx===src&&b===1)||(idx===dst&&b===4);
            if(!legit&&leakCell<0){ leaked=true; leakCell=idx; } continue; }
          if(open(n)&this.opp(b)){ if(!lit[n]){ lit[n]=true; q.push(n); } }
          else if(leakCell<0){ leaked=true; leakCell=idx; }   // open pipe spilling against a wall
        }
      }
    }
    const reachedDest = lit[dst] && !!(open(dst)&4);
    return {lit, order, leaked, leakCell, reachedDest, segments:order.length};
  },
  recompute(){ this.flowInfo=this.flow(); }, // cached lighting for the build phase
  // ── release the valve (manual, or auto at timeLeft 0) ──
  release(){
    if(this.phase!=='build') return;
    const f=this.result=this.flow();
    this.solved = f.reachedDest && !f.leaked;
    this.gained = this.solved ? Math.max(0,Math.round(this.timeLeft))*f.segments : 0;
    this.stopN = f.leaked ? (f.order.indexOf(f.leakCell)+1) : f.order.length;
    this.phase='flow'; this.flowT=0; this.fillN=0;
    sTick(0.05);
  },
  resolveFlow(){
    const f=this.result;
    if(this.solved){
      this.score+=this.gained;
      if(this.score>this.best){ this.best=this.score; this.newBest=true; saveBest(this.bestKey,this.score); }
      const d=this.dstIdx, N=this.N, cx=this.GX+(d%N)*this.cell+this.cell/2, cy=this.GY+((d/N)|0)*this.cell+this.cell/2;
      burst(cx,cy,this.pal().glow,18,4); burst(cx,cy,'#eaffcf',8,2.6);
      pop(this.gained>0?'+'+this.gained:'GUNGED!',cx,cy-20,this.pal().ring,8);
      sGold(); buzz(20); this.shake=6;
      this.stage++; this.banner={t:'GUNGED!',life:1.3}; this.genBoard();
    } else {
      const lc=f.leakCell>=0?f.leakCell:this.srcIdx, N=this.N;
      const cx=this.GX+(lc%N)*this.cell+this.cell/2, cy=this.GY+((lc/N)|0)*this.cell+this.cell/2;
      burst(cx,cy,'#a6ff44',16,3.8); pop('LEAK!',cx,cy-20,'#ff5a5a',8);
      sBad(); buzz(50); this.shake=8; this.lives--;
      if(this.lives<=0){ this.st='over'; this.overAt=performance.now(); if(this.onOver) this.onOver(); }
      else this.genBoard(); // fresh board, same stage
    }
  },
  update(dt){
    this.shake*=0.82;
    if(this.banner){ this.banner.life-=dt*0.7; if(this.banner.life<=0) this.banner=null; }
    if(this.st!=='play') return;
    if(this.phase==='build'){
      this.timeLeft-=dt;
      if(this.timeLeft<=0){ this.timeLeft=0; this.release(); } // auto-release banks no time
    } else if(this.phase==='flow'){
      this.flowT+=dt;
      this.fillN=Math.min(this.stopN, Math.floor(this.flowT/this.FILL_STEP));
      if(this.fillN>=this.stopN) this.resolveFlow();
    }
  },
  // ── drawing ──
  valveRect(){ return {x:W/2-74, y:466, w:148, h:46}; },
  drawTile(idx){
    const N=this.N, s=this.cell, col=idx%N, row=(idx/N)|0;
    const x0=this.GX+col*s, y0=this.GY+row*s, cx=x0+s/2, cy=y0+s/2;
    const p=this.pal(), t=this.tiles[idx], om=this.rotMask(t.shape,t.r);
    const filled = this.phase==='flow' && this.result && this.result.order.indexOf(idx)>=0 && this.result.order.indexOf(idx)<this.fillN;
    const lit = this.phase==='build' && this.flowInfo && this.flowInfo.lit[idx];
    // tile base
    rr(x0+2,y0+2,s-4,s-4,7); ctx.fillStyle='#0c1a08'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1; rr(x0+2,y0+2,s-4,s-4,7); ctx.stroke();
    // pipe arms
    const pw=s*this.PW, col2 = filled?p.glow : lit?p.ring : '#4a5a3a';
    ctx.save();
    if(filled){ ctx.shadowColor=p.glow; ctx.shadowBlur=12; } else if(lit){ ctx.shadowColor=p.ring; ctx.shadowBlur=6; }
    ctx.fillStyle=col2;
    if(om&1){ rr(cx-pw/2,y0,pw,s/2+2,pw*0.4); ctx.fill(); }
    if(om&4){ rr(cx-pw/2,cy-2,pw,s/2+2,pw*0.4); ctx.fill(); }
    if(om&2){ rr(cx-2,cy-pw/2,s/2+2,pw,pw*0.4); ctx.fill(); }
    if(om&8){ rr(x0,cy-pw/2,s/2+2,pw,pw*0.4); ctx.fill(); }
    ctx.beginPath(); ctx.arc(cx,cy,pw*0.62,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // endpoint markers
    if(idx===this.srcIdx){ ctx.fillStyle=p.acc; rr(cx-9,y0-6,18,7,2); ctx.fill(); }       // valve cap above source
    if(idx===this.dstIdx){ ctx.fillStyle=p.acc; rr(cx-11,y0+s-1,22,7,2); ctx.fill(); }     // tank lip below dest
  },
  render(){
    const p=this.pal();
    ctx.save();
    if(this.shake>0.4) ctx.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake*0.7);
    drawBG(p);
    // HUD
    ctx.textAlign='center';
    ctx.font='26px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=14;
    ctx.fillText(this.score,W/2,76); ctx.shadowBlur=0;
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fillText('BEST '+this.best,W/2,96);
    for(let i=0;i<3;i++){ const lx=W/2-26+i*26; ctx.save(); ctx.globalAlpha=i<this.lives?1:0.18;
      ctx.fillStyle=p.ring; rr(lx-5,105,10,10,2); ctx.fill(); ctx.restore(); }
    ctx.font='6px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.fillText('STAGE '+(this.stage+1),W/2,128);
    // countdown bar (the puzzle clock — not a score cap; game is endless, D3)
    const bx=44, bw=W-88, frac=Math.max(0,Math.min(1,this.timeLeft/this.stageTime()));
    rr(bx-1,135,bw+2,8,3); ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fill();
    ctx.fillStyle=frac<0.25?'#ff5a5a':(frac<0.5?'#ffd24a':p.ring);
    rr(bx,136,Math.max(0,bw*frac),6,2); ctx.fill();
    // grid
    for(let idx=0;idx<this.N*this.N;idx++) this.drawTile(idx);
    drawFX();
    // RELEASE valve button (drawn, rule 4)
    const v=this.valveRect(), enabled=this.phase==='build'&&this.st==='play';
    ctx.save(); ctx.globalAlpha=enabled?1:0.4;
    rr(v.x,v.y,v.w,v.h,10); ctx.fillStyle=p.acc+'55'; ctx.fill();
    ctx.strokeStyle=p.ring; ctx.lineWidth=2; rr(v.x,v.y,v.w,v.h,10); ctx.stroke();
    const vcx=v.x+26, vcy=v.y+v.h/2; // little valve wheel
    ctx.strokeStyle=p.glow; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(vcx,vcy,9,0,Math.PI*2); ctx.stroke();
    for(let a=0;a<4;a++){ const an=a*Math.PI/2; ctx.beginPath(); ctx.moveTo(vcx+Math.cos(an)*9,vcy+Math.sin(an)*9); ctx.lineTo(vcx+Math.cos(an)*14,vcy+Math.sin(an)*14); ctx.stroke(); }
    ctx.fillStyle='#fff'; ctx.font='9px "Press Start 2P"'; ctx.textAlign='left'; ctx.fillText('RELEASE',v.x+44,vcy+3);
    ctx.restore();
    if(this.rejectAt&&performance.now()-this.rejectAt<200){ ctx.save(); ctx.globalAlpha=0.12; ctx.fillStyle='#ff5a5a'; ctx.fillRect(0,0,W,H); ctx.restore(); }
    if(this.banner){ const b=this.banner, a2=Math.min(1,b.life*2);
      ctx.save(); ctx.globalAlpha=a2; ctx.textAlign='center'; ctx.font='11px "Press Start 2P"';
      ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=16; ctx.fillText(b.t,W/2,148); ctx.restore(); }
    // rank
    const rk=rankFor(this.ranks,this.score);
    ctx.textAlign='center'; ctx.font='7px "Press Start 2P"'; ctx.fillStyle=p.ring; ctx.fillText(rk.t,W/2,H-42);
    const nx=nextRank(this.ranks,this.score);
    if(nx){ ctx.font='5px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillText((nx.s-this.score)+' TO '+nx.t,W/2,H-26); }
    ctx.restore();
    if(this.st==='ready') drawReadyScreen(p,'GUNGE',['TAP A PIPE TO ROTATE IT','CONNECT THE TOP VALVE TO THE TANK','LIT PIPES ARE LINKED TO THE VALVE','HIT RELEASE EARLY TO BANK THE CLOCK']);
    if(this.st==='over') drawOverScreen(p,'TANK OVERFLOWED',this.score,this.best,this.newBest,rankFor(this.ranks,this.score).t,'STAGE '+(this.stage+1));
  },
  tap(x,y){
    if(this.st==='ready'){ this.start(); return; }
    if(this.st==='over'){ if(performance.now()-this.overAt>450){ this.init(); this.start(); } return; }
    if(this.phase!=='build') return;                     // locked while the gunge is flowing
    if(inR(x,y,this.valveRect())){ this.release(); return; }
    const N=this.N, s=this.cell;
    const col=Math.floor((x-this.GX)/s), row=Math.floor((y-this.GY)/s);
    if(col<0||col>=N||row<0||row>=N){ this.rejectAt=performance.now(); return; } // outside grid = free no-op
    const idx=row*N+col; this.tiles[idx].r=(this.tiles[idx].r+1)&3;
    this.recompute(); sTick(0.03); buzz(6);
  }
};

// ════════════════════════════════════════════════════════════════
//  GAME: TAZO TYCOON  (Phase 5, Unit 5 — §5.3)
//  Directional-swipe 2048 over chip-packet tazos. The hub's only pure
//  spatial-strategy game — NO time pressure by nature (D3-friendly).
//  Verb = COARSE swipe: press() records the origin, release() picks the
//  dominant axis past DIR_THRESH → U/D/L/R. drag() is deliberately
//  absent (D12/§5.3 — a 2048 board wants no live preview), so the router
//  leaves cur.drag undefined and just streams press→release. tap() is
//  only ever reached for ready-start / over-restart (router calls it on
//  release when st!=='play') — gameplay never touches it.
//
//  ── ESCALATING SPAWN PRESSURE is a FIRST-CLASS mechanic (§5.3 makes it
//  a design REQUIREMENT, not polish): an 11-game daily cannot carry a
//  10-minute 2048 run. Two curves govern run length, both climbing as
//  you play:
//    (1) spawn COUNT  = min(SPAWN_CAP, 1 + floor(moves/SPAWN_K)) — tiles
//        per move grow with MOVES (inevitable, skill-proof), so free
//        space eventually collapses no matter how well you play.
//    (2) spawn floor-TIER rises with SCORE (TIER_BANDS) — the board
//        clots with holo/gold that a single low merge can't clear.
//  The tier-4 MEGA SLAMMER is the opposing RELIEF valve: forming one
//  (gold+gold) detonates the low-tier CLUTTER around it (orthogonal
//  neighbours of tier ≤ SLAM_MAXTIER) and is consumed. Clearing only
//  clutter makes the valve self-weaken late (fewer low tiles as the
//  board climbs), so it extends play without becoming an infinite pump —
//  the failure mode a full-radius detonation caused in sim. Retune the
//  run length via SPAWN_K / TIER_BANDS (a time cap is forbidden — D3),
//  NOT by nerfing the merge.
//
//  Numbers below are SIM-DERIVED this session (no human play): a headless
//  replica measured greedy-optimal ≈3.3 min median run (p90 ≈10.8 min),
//  random ≈2.8 min; a mega slammer forms in a typical run. par set so a
//  careful daily run lands ~200–290 normalised (only god-runs peg 625) —
//  the GUNGE-par lesson (§7). Flip CALIBRATE on to log real moves+seconds
//  per run; ALL PROVISIONAL — retune with the roster (§7).
//
//  Loss = board full with NO legal merge in any direction: ONE terminal
//  state. This is a DELIBERATE divergence from D14's "3-lives" reading —
//  2048's natural loss is a single board-lock, par-normalisation still
//  works on the resulting score, and D14 explicitly allows revisit.
//  Seeded (D16-trivial — a 2048 board is always playable): spawn slots +
//  tiers via srnd(), so the daily replays identically. Reuses drawBG /
//  ready+over screens / burst+pop. (Section labels track FILE order — §7.)
// ════════════════════════════════════════════════════════════════
const TAZO_COL=[ // tier → disc colours (holo-blue family, PALS[7]); drawn, rule 4
  {face:'#243357',edge:'#6a8cff',glow:'#6a8cff',pip:'#cdd8ff'}, // 0 plastic
  {face:'#5a4620',edge:'#e0a84a',glow:'#ffcc66',pip:'#ffe6b0'}, // 1 cardboard
  {face:'#1f5560',edge:'#3ae8ff',glow:'#7affff',pip:'#d6ffff'}, // 2 holo
  {face:'#6a5212',edge:'#ffd24a',glow:'#ffe680',pip:'#fff4c8'}, // 3 gold
  {face:'#8a8ad0',edge:'#ffffff',glow:'#ffffff',pip:'#ffffff'}, // 4 mega slammer (transient — detonates on formation, never rests)
];
const TAZO={
  id:'tazo', name:'TAZO TYCOON', tag:'SWIPE TO STACK SLAMMERS',
  bestKey:'arc_tazo_best',
  par:4500, // PROVISIONAL — sim-derived (greedy median ≈5257); retune with the roster (§5.6/§7)
  ranks:[{s:0,t:'SWAPSIE ROOKIE'},{s:800,t:'LUNCHTIME TRADER'},{s:2500,t:'HOLO HOARDER'},{s:6000,t:'GOLD SLAMMER'},{s:14000,t:'TAZO TYCOON'}],

  // ── board geometry (360×640 logical, rule 2) ────────────────────
  N:4, GX:36, GY:198, CELL:66, GAP:6, // 4×66 + 3×6 = 282 wide, centred-ish

  // ── swipe → direction ───────────────────────────────────────────
  DIR_THRESH:30, // px — below this the gesture is a harmless no-op, no penalty (§8)

  // ── ESCALATING SPAWN PRESSURE (first-class — ALL PROVISIONAL) ────
  SPAWN_K:6,   // spawn count steps up every SPAWN_K moves
  SPAWN_CAP:12,// hard ceiling on tiles/move (12 floods a 16-cell board fast)
  MAX_TIER:4,  // 4 = mega slammer (transient, detonates on formation)
  SLAM_MAXTIER:1, // detonation clears orthogonal neighbours up to this tier (clutter only)
  // spawn floor-tier by score: rising score drops tier-0 so the board clots
  TIER_BANDS:[
    {s:0,   pool:[0,0,0,0,1]}, // mostly plastic
    {s:60,  pool:[0,0,1,1,2]}, // cardboard creeps in
    {s:180, pool:[0,1,1,2,2]}, // holo pressure
    {s:360, pool:[1,1,2,2,3]}, // gold clutter, no more plastic
  ],
  MERGE_PTS:[0,3,8,20,0], // points for MERGING INTO tier t (t=4 scored via the slam)
  SLAM_PTS:6,             // per cell a mega slammer clears (incl. itself)
  SLIDE_T:0.09, BUMP_T:0.16, // animation seconds

  CALIBRATE:false, // logs moves + seconds + score per run to console on game over (§7)

  cellXY(i){ const r=Math.floor(i/this.N), c=i%this.N;
    return {x:this.GX+c*(this.CELL+this.GAP), y:this.GY+r*(this.CELL+this.GAP)}; },
  spawnCount(){ return Math.min(this.SPAWN_CAP, 1+Math.floor(this.moves/this.SPAWN_K)); },
  tierPool(){ let b=this.TIER_BANDS[0]; this.TIER_BANDS.forEach(x=>{ if(this.score>=x.s) b=x; }); return b.pool; },

  init(){
    this.best=loadBest(this.bestKey); this.newBest=false;
    this.score=0; this.moves=0; this.slams=0; this.topTier=0;
    this.cells=new Array(this.N*this.N).fill(-1);        // logical board: tier or -1
    this.bump=new Array(this.N*this.N).fill(0);          // per-cell merge/spawn scale bounce
    this.slideFrom=new Array(this.N*this.N).fill(null);  // {dx,dy} px a tile slid from
    this.slideT=0; this.shake=0; this.rejectFlash=0;
    this.aim=null; this.startAt=performance.now();
    this.st='ready'; this.overAt=0;
    parts=[]; pops=[];
    this.spawnTiles(2);            // opening board
    this.slideFrom.fill(null);     // no slide on the very first tiles
    this.bump.fill(0);
  },
  start(){ this.st='play'; this.startAt=performance.now(); },
  gameOver(){
    this.st='over'; this.overAt=performance.now();
    if(this.CALIBRATE){ const secs=((performance.now()-this.startAt)/1000).toFixed(1);
      console.log('TAZO run: moves='+this.moves+' secs='+secs+' score='+this.score+' slams='+this.slams+' top='+this.topTier); }
    sBad(); buzz(70); if(this.onOver) this.onOver();
  },

  // ── pointer stream (D12): press + release, drag ignored (§5.3) ───
  press(x,y){ this.aim={x0:x,y0:y}; },
  release(x,y){
    const a=this.aim; this.aim=null;
    if(!a || this.st!=='play') return; // pointercancel with no drag lands here → no-op below
    const dx=x-a.x0, dy=y-a.y0;
    if(Math.max(Math.abs(dx),Math.abs(dy))<this.DIR_THRESH){ this.rejectFlash=1; sTick(0.02); return; } // §8 free no-op
    const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U');
    this.move(dir);
  },
  tap(x,y){
    if(this.st==='ready'){ this.start(); return; }
    if(this.st==='over'){ if(performance.now()-this.overAt>450){ this.init(); this.start(); } return; }
    // during play the router routes to press/release — never here (D12)
  },

  // cell indices of each line in dest→far order for a given direction
  lines(dir){
    const N=this.N, out=[];
    for(let k=0;k<N;k++){ const ln=[];
      for(let j=0;j<N;j++){
        if(dir==='L') ln.push(k*N+j);
        else if(dir==='R') ln.push(k*N+(N-1-j));
        else if(dir==='U') ln.push(j*N+k);
        else ln.push((N-1-j)*N+k); // 'D'
      }
      out.push(ln);
    }
    return out;
  },
  move(dir){
    const N=this.N, next=new Array(N*N).fill(-1), from=new Array(N*N).fill(null), merges=[];
    let moved=false;
    for(const ln of this.lines(dir)){
      const seq=[]; for(const idx of ln){ if(this.cells[idx]>=0) seq.push({t:this.cells[idx],src:idx}); }
      const out=[];
      for(let i=0;i<seq.length;i++){
        if(i+1<seq.length && seq[i].t===seq[i+1].t && seq[i].t<this.MAX_TIER){
          out.push({t:seq[i].t+1, src:seq[i].src, merged:true}); i++; // consume the pair (once per tile per move)
        } else out.push({t:seq[i].t, src:seq[i].src, merged:false});
      }
      for(let pos=0;pos<out.length;pos++){
        const destIdx=ln[pos], tile=out[pos];
        next[destIdx]=tile.t;
        if(tile.src!==destIdx || tile.merged){ const sc=this.cellXY(tile.src), dc=this.cellXY(destIdx); from[destIdx]={dx:sc.x-dc.x,dy:sc.y-dc.y}; }
        if(tile.src!==destIdx) moved=true;
        if(tile.merged){ moved=true; merges.push({idx:destIdx,tier:tile.t}); }
      }
    }
    if(!moved){ this.rejectFlash=1; sTick(0.02); return; } // no change = free no-op (§8)
    this.cells=next; this.slideFrom=from; this.slideT=1; this.moves++;
    for(const m of merges){
      this.bump[m.idx]=1; this.topTier=Math.max(this.topTier,m.tier);
      const q=this.cellXY(m.idx), cx=q.x+this.CELL/2, cy=q.y+this.CELL/2;
      if(m.tier>=this.MAX_TIER){ this.detonate(m.idx); }
      else {
        this.score+=this.MERGE_PTS[m.tier];
        pop('+'+this.MERGE_PTS[m.tier],cx,cy-6,TAZO_COL[m.tier].glow,7);
        burst(cx,cy,TAZO_COL[m.tier].glow,7,2.6);
      }
    }
    sHit(); this.clack(); buzz(8);
    this.spawnTiles(this.spawnCount());  // ESCALATING SPAWN PRESSURE — after every effective move
    if(this.score>this.best){ this.best=this.score; this.newBest=true; saveBest(this.bestKey,this.score); }
    if(!this.hasMove()) this.gameOver();
  },
  detonate(idx){
    this.slams++;
    const N=this.N, r=Math.floor(idx/N), c=idx%N;
    const q=this.cellXY(idx), cx=q.x+this.CELL/2, cy=q.y+this.CELL/2;
    let cleared=0;
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ // orthogonal clutter only
      const rr2=r+dr, cc=c+dc; if(rr2<0||rr2>=N||cc<0||cc>=N) continue;
      const j=rr2*N+cc;
      if(this.cells[j]>=0 && this.cells[j]<=this.SLAM_MAXTIER){ this.cells[j]=-1; cleared++;
        const w=this.cellXY(j); burst(w.x+this.CELL/2,w.y+this.CELL/2,'#a6c8ff',6,2.4); }
    }
    this.cells[idx]=-1; // the slammer is consumed (transient tier-4)
    const pts=this.SLAM_PTS*(cleared+1); this.score+=pts;
    pop('SLAM! +'+pts,cx,cy-8,'#ffffff',9);
    burst(cx,cy,'#ffffff',18,3.6); this.shake=1; sGold(); buzz(30);
  },
  spawnTiles(n){
    const empties=[]; for(let i=0;i<this.cells.length;i++) if(this.cells[i]<0) empties.push(i);
    const pool=this.tierPool(); n=Math.min(n,empties.length);
    for(let k=0;k<n;k++){
      const idx=empties.splice(Math.floor(srnd(this)*empties.length),1)[0];
      this.cells[idx]=pool[Math.floor(srnd(this)*pool.length)];
      this.bump[idx]=0.7; // gentle spawn pop
    }
  },
  hasMove(){
    const N=this.N;
    for(let i=0;i<this.cells.length;i++) if(this.cells[i]<0) return true;
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){ const t=this.cells[r*N+c];
      if(c+1<N && this.cells[r*N+c+1]===t && t<this.MAX_TIER) return true;
      if(r+1<N && this.cells[(r+1)*N+c]===t && t<this.MAX_TIER) return true;
    }
    return false;
  },
  clack(){ beep(180,0.03,'square',0.05); beep(120,0.045,'triangle',0.04); }, // plastic tazo clack

  update(dt){
    if(this.rejectFlash>0) this.rejectFlash-=dt*3;
    if(this.shake>0) this.shake-=dt*3;
    if(this.slideT>0) this.slideT=Math.max(0,this.slideT-dt/this.SLIDE_T);
    for(let i=0;i<this.bump.length;i++) if(this.bump[i]>0) this.bump[i]=Math.max(0,this.bump[i]-dt/this.BUMP_T);
  },

  drawTazo(cx,cy,tier,s){
    const col=TAZO_COL[tier], R=this.CELL*0.44*s;
    ctx.save(); ctx.translate(cx,cy);
    const g=ctx.createRadialGradient(-R*0.3,-R*0.35,R*0.2,0,0,R);
    g.addColorStop(0,col.edge); g.addColorStop(0.5,col.face); g.addColorStop(1,'#0a0f1e');
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle=col.edge; ctx.lineWidth=2.5; ctx.shadowColor=col.glow; ctx.shadowBlur=tier>=2?9:3;
    ctx.beginPath(); ctx.arc(0,0,R-1.5,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,0,R*0.6,0,Math.PI*2); ctx.stroke();
    drawMark(0,0,R*0.86,col.pip); // brand mark centre — hub cohesion (drawn, rule 4)
    ctx.restore();
  },
  render(){
    const p=PALS[7], N=this.N;
    let ox=0,oy=0;
    if(this.shake>0){ ox=(Math.random()-0.5)*7*this.shake; oy=(Math.random()-0.5)*7*this.shake; }
    ctx.save(); ctx.translate(ox,oy);
    drawBG(p,H-30);
    const span=N*this.CELL+(N-1)*this.GAP, pad=8;
    rr(this.GX-pad,this.GY-pad,span+pad*2,span+pad*2,14);
    ctx.fillStyle='rgba(6,10,26,0.72)'; ctx.fill();
    ctx.globalAlpha=this.rejectFlash>0?0.85:0.5; ctx.strokeStyle=this.rejectFlash>0?'#ff6a8a':p.ring; ctx.lineWidth=2;
    rr(this.GX-pad,this.GY-pad,span+pad*2,span+pad*2,14); ctx.stroke(); ctx.globalAlpha=1;
    for(let i=0;i<N*N;i++){ const q=this.cellXY(i);
      rr(q.x,q.y,this.CELL,this.CELL,10); ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fill(); }
    for(let i=0;i<N*N;i++){ if(this.cells[i]<0) continue;
      const q=this.cellXY(i); let dx=0,dy=0;
      if(this.slideT>0 && this.slideFrom[i]){ const e=this.slideT*this.slideT; dx=this.slideFrom[i].dx*e; dy=this.slideFrom[i].dy*e; }
      const b=this.bump[i], scl=1+(b>0?Math.sin((1-b)*Math.PI*2)*0.16*b:0); // double-strike bounce
      this.drawTazo(q.x+this.CELL/2+dx,q.y+this.CELL/2+dy,this.cells[i],scl);
    }
    drawFX();
    ctx.restore();
    // HUD (unshaken)
    ctx.textAlign='center';
    ctx.font='26px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=14;
    ctx.fillText(this.score,W/2,80); ctx.shadowBlur=0;
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fillText('BEST '+this.best,W/2,100);
    const spc=this.st==='play'?this.spawnCount():1; // surface the escalation to the player
    ctx.font='6px "Press Start 2P"'; ctx.fillStyle=spc>=4?'#ff6a8a':spc>=2?'#ffd24a':'rgba(255,255,255,0.4)';
    ctx.fillText('SPAWN ×'+spc,W/2,118);
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle=p.ring; ctx.fillText(rankFor(this.ranks,this.score).t,W/2,H-14);
    if(this.CALIBRATE){ ctx.font='6px "Press Start 2P"'; ctx.fillStyle='#8aff8a'; ctx.textAlign='left';
      ctx.fillText('mv='+this.moves+' spc='+spc+' sl='+this.slams,8,H-30); }
    if(this.st==='ready') drawReadyScreen(p,'TAZO TYCOON',['SWIPE TO SLIDE THE TAZOS','MATCH TWO TO TRADE UP A TIER','GOLD+GOLD = MEGA SLAMMER','BOARD FILLS FASTER AS YOU CLIMB']);
    if(this.st==='over') drawOverScreen(p,'BOARD LOCKED',this.score,this.best,this.newBest,rankFor(this.ranks,this.score).t,'MOVES '+this.moves+' · '+this.slams+' SLAMS');
  }
};

// ════════════════════════════════════════════════════════════════
//  GAME: DAIRY WARMER  (Phase 5, Unit 6 — §5.4)
//  Spatial-packing on the corner-dairy pie warmer. The hub's only CALM
//  game — no clock, no falling piece, no reaction test (D3-friendly).
//  Verb = TAP-only (D13, settled): tap a pastry in the tray to SELECT it
//  (held preview + rotation), tap the drawn ROTATE button to cycle its
//  orientation, tap a shelf cell to PLACE it. NO drag, NO press() — so
//  per D12/§3 the router leaves it on tap()-on-pointerdown, exactly like
//  GUNGE. Blockdoku-style: place trominoes/tetromino anywhere on the 6×4
//  shelf, a FULL HORIZONTAL ROW sells (clears) with a neon FRESH! flash,
//  no gravity. Multi-row clears score exponentially (double-decker order).
//
//  Tray of 3, place in ANY ORDER (reading B, owner-approved 2026-07-18):
//  §5.4's "tap a queued pastry to select" reads as free choice, which
//  suits the calm ethos better than a forced FIFO head; the loss check is
//  generalised from "the head can't fit" to "no tray piece fits anywhere".
//  STRIKE = the whole tray is dead (D14, 3-lives): heat escapes, a life is
//  lost, the shelf is WIPED (fresh warmer) and a new tray dealt — the wipe
//  guarantees the fresh tray is placeable, so a strike can never chain in
//  one frame. 3 strikes = over.
//
//  §8 holds throughout: tapping an invalid cell, an empty cell, or the
//  rotate button with nothing held is a FREE no-op with a soft reject
//  flash — never a strike. A strike is a board-state consequence, not a
//  tap penalty. Seeded (D16-trivial): tray order via srnd(); placement /
//  clear math stays live so free play is byte-identical. Reuses drawBG /
//  ready+over screens / burst+pop / ranks (rule 9). par & all constants
//  PROVISIONAL — retune with the roster (§5.6/§7). (Labels track FILE
//  order — §7.)
// ════════════════════════════════════════════════════════════════
const DAIRY={
  id:'dairy', name:'DAIRY WARMER', tag:'PACK THE PIE WARMER',
  bestKey:'arc_dairy_best',
  // par PROVISIONAL & SIM-INFORMED (no human play). A headless greedy replica over 200
  // seeds scored median ≈4620 (p10 ≈2580, p90 ≈7980), median ≈147 placements/run — so the
  // spec's par:250 would peg the 625 normaliser cap for ANY competent player (the GUNGE/TAZO
  // par lesson). Set ~2200 so a strong run lands mid-band, not pegged. CAVEAT the other way:
  // DAIRY has NO clock and a forgiving wipe-on-strike, so the greedy bot OVER-states a human
  // (free row-clears + full resets) — real play may sit well below 4620, i.e. par may need to
  // come DOWN after data, unlike the usual "too low" story. Retune with the roster (§7).
  par:2200, // PROVISIONAL
  ranks:[{s:0,t:'AFTER-SCHOOL REGULAR'},{s:400,t:'COUNTER HAND'},{s:1000,t:'WARMER WRANGLER'},{s:2000,t:'PIE ARCHITECT'},{s:3500,t:'DAIRY OWNER'}], // PROVISIONAL
  COLS:6, ROWS:4, CELL:50, GX:30, GY:140,   // 6×4 glass shelf, 300×200 box
  BASE_CLEAR:60,                             // per-row clear base — score += BASE×(2^rows − 1) (PROVISIONAL)
  // Pastries as origin-relative [col,row] cells; orientations derived + deduped in init().
  SHAPES:[
    {name:'MINCE & CHEESE', col:'#e0a84a', cells:[[0,0],[1,0],[0,1],[1,1]]}, // 2×2 — 1 orientation
    {name:'SAUSAGE ROLL',   col:'#d69a52', cells:[[0,0],[1,0],[2,0]]},       // 1×3 — 2 orientations
    {name:'POTATO-TOP',     col:'#c07838', cells:[[0,0],[0,1],[1,1]]},       // L-tromino — 4 orientations
  ],
  pal(){ return PALS[8]; }, // warm caramel (hues PROVISIONAL, §3/§7)
  // ── orientation maths (built once per init) ──
  buildOris(){
    const norm=cs=>{ const mc=Math.min(...cs.map(p=>p[0])), mr=Math.min(...cs.map(p=>p[1])); return cs.map(([c,r])=>[c-mc,r-mr]); };
    const key=cs=>cs.map(p=>p[0]+','+p[1]).sort().join(';');
    const rot=cs=>cs.map(([c,r])=>[-r,c]); // 90° CW about origin
    this.ORIS=this.SHAPES.map(s=>{
      const out=[], seen={}; let cur=s.cells;
      for(let i=0;i<4;i++){ const n=norm(cur), k=key(n); if(!seen[k]){ seen[k]=1; out.push(n); } cur=rot(cur); }
      return out;
    });
  },
  init(){
    this.buildOris();
    this.grid=new Array(this.COLS*this.ROWS).fill(null); // null = empty, else pastry colour
    this.tray=[]; this.sel=-1; this.rot=0;
    this.lives=3; this.score=0; this.served=0; this.rowsCleared=0;
    this.shake=0; this.banner=null; this.rejectAt=0; this.reject=null; // reject={cells,col,row}
    this.best=loadBest(this.bestKey); this.newBest=false;
    this.st='ready'; this.overAt=0;
    parts=[]; pops=[];
    this.dealTray();
  },
  start(){ this.st='play'; },
  // ── tray / pieces ──
  dealTray(){ while(this.tray.length<3) this.tray.push(Math.floor(srnd(this)*this.SHAPES.length)); },
  orisFor(shapeIdx){ return this.ORIS[shapeIdx]; },
  fits(cells,col,row){
    for(const [dc,dr] of cells){ const c=col+dc, r=row+dr;
      if(c<0||c>=this.COLS||r<0||r>=this.ROWS) return false;
      if(this.grid[r*this.COLS+c]!==null) return false; }
    return true;
  },
  canPlaceAny(shapeIdx){
    const oris=this.orisFor(shapeIdx);
    for(const o of oris) for(let r=0;r<this.ROWS;r++) for(let c=0;c<this.COLS;c++) if(this.fits(o,c,r)) return true;
    return false;
  },
  trayDead(){ return this.tray.every(s=>!this.canPlaceAny(s)); },
  // ── placement + clears ──
  place(col,row){
    const shapeIdx=this.tray[this.sel], ori=this.orisFor(shapeIdx)[this.rot%this.orisFor(shapeIdx).length];
    if(!this.fits(ori,col,row)){ // soft reject — free no-op (§8), red ghost so the misfit is legible
      this.reject={cells:ori,col,row}; this.rejectAt=performance.now(); sBad(); return;
    }
    const s=this.SHAPES[shapeIdx];
    for(const [dc,dr] of ori){ const c=col+dc, r=row+dr; this.grid[r*this.COLS+c]=s.col;
      const cx=this.GX+c*this.CELL+this.CELL/2, cy=this.GY+r*this.CELL+this.CELL/2; burst(cx,cy,s.col,4,1.8); }
    this.served++; sHit(); buzz(8);
    this.tray.splice(this.sel,1); this.sel=-1; this.rot=0; this.reject=null;
    this.dealTray();
    this.resolveClears();
    if(this.st==='play' && this.trayDead()) this.strike();
  },
  resolveClears(){
    const full=[];
    for(let r=0;r<this.ROWS;r++){ let f=true; for(let c=0;c<this.COLS;c++) if(this.grid[r*this.COLS+c]===null){ f=false; break; } if(f) full.push(r); }
    const n=full.length; if(!n) return;
    const p=this.pal();
    for(const r of full){ for(let c=0;c<this.COLS;c++){ const cx=this.GX+c*this.CELL+this.CELL/2, cy=this.GY+r*this.CELL+this.CELL/2;
      burst(cx,cy,p.glow,6,3); this.grid[r*this.COLS+c]=null; } }
    this.rowsCleared+=n;
    const gained=this.BASE_CLEAR*(Math.pow(2,n)-1); // exponential — double-decker order
    this.score+=gained;
    if(this.score>this.best){ this.best=this.score; this.newBest=true; saveBest(this.bestKey,this.score); }
    const my=this.GY+full[0]*this.CELL+this.CELL/2;
    pop((n>1?n+' ROWS! ':'')+'+'+gained,W/2,my-4,p.ring,9);
    this.banner={t:n>1?'FRESH ×'+n+'!':'FRESH!',life:1.3};
    if(n>1){ sGold(); this.shake=6; } else sPerfect();
    buzz(n>1?24:12);
  },
  strike(){
    this.lives--; this.shake=8; sBad(); buzz(50);
    this.banner={t:'HEAT ESCAPED!',life:1.4};
    pop('-1',W/2,this.GY+100,'#ff5a5a',10);
    if(this.lives<=0){ this.st='over'; this.overAt=performance.now(); if(this.onOver) this.onOver(); return; }
    this.grid.fill(null);          // heat escaped → empty the warmer, fresh shelf (guarantees a placeable tray)
    this.tray=[]; this.sel=-1; this.rot=0; this.reject=null; this.dealTray();
  },
  update(dt){
    this.shake*=0.82;
    if(this.banner){ this.banner.life-=dt*0.7; if(this.banner.life<=0) this.banner=null; }
  },
  // ── layout ──
  rotRect(){ return {x:W-104, y:462, w:92, h:44}; },
  traySlotRect(i){ const bw=98, gap=6, x0=W/2-(bw*3+gap*2)/2; return {x:x0+i*(bw+gap), y:372, w:bw, h:70}; },
  // draw an orientation's cells centred in a box (tray/ghost previews)
  drawPiece(cx,cy,cells,cell,col,alpha){
    let mc=1e9,mr=1e9,xc=-1e9,xr=-1e9;
    for(const [c,r] of cells){ mc=Math.min(mc,c); mr=Math.min(mr,r); xc=Math.max(xc,c); xr=Math.max(xr,r); }
    const w=(xc-mc+1)*cell, h=(xr-mr+1)*cell, ox=cx-w/2-mc*cell, oy=cy-h/2-mr*cell;
    ctx.save(); ctx.globalAlpha=alpha==null?1:alpha;
    for(const [c,r] of cells){ const x=ox+c*cell, y=oy+r*cell; rr(x+1,y+1,cell-2,cell-2,4); ctx.fillStyle=col; ctx.fill(); }
    ctx.restore();
  },
  render(){
    const p=this.pal();
    ctx.save();
    if(this.shake>0.4) ctx.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake*0.7);
    drawBG(p);
    // HUD
    ctx.textAlign='center';
    ctx.font='26px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=14;
    ctx.fillText(this.score,W/2,76); ctx.shadowBlur=0;
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fillText('BEST '+this.best,W/2,96);
    for(let i=0;i<3;i++){ const lx=W/2-26+i*26; ctx.save(); ctx.globalAlpha=i<this.lives?1:0.18;
      ctx.fillStyle=p.ring; rr(lx-5,105,10,10,2); ctx.fill(); ctx.restore(); }
    // shelf
    const CELL=this.CELL;
    for(let r=0;r<this.ROWS;r++) for(let c=0;c<this.COLS;c++){
      const x0=this.GX+c*CELL, y0=this.GY+r*CELL, v=this.grid[r*this.COLS+c];
      rr(x0+2,y0+2,CELL-4,CELL-4,7); ctx.fillStyle=v?v:'#1a1206'; ctx.fill();
      ctx.strokeStyle=v?'rgba(255,255,255,0.18)':'rgba(255,255,255,0.06)'; ctx.lineWidth=1; rr(x0+2,y0+2,CELL-4,CELL-4,7); ctx.stroke();
      if(v){ ctx.fillStyle='rgba(255,255,255,0.14)'; rr(x0+6,y0+6,CELL-12,6,3); ctx.fill(); } // glass sheen
    }
    // glass shelf edges
    ctx.strokeStyle=p.acc+'88'; ctx.lineWidth=2;
    for(let r=0;r<=this.ROWS;r++){ const y=this.GY+r*CELL; ctx.beginPath(); ctx.moveTo(this.GX-4,y); ctx.lineTo(this.GX+this.COLS*CELL+4,y); ctx.stroke(); }
    // reject ghost (soft misfit, §8)
    if(this.reject&&performance.now()-this.rejectAt<220){
      const g=this.reject;
      for(const [dc,dr] of g.cells){ const c=g.col+dc, r=g.row+dr;
        if(c<0||c>=this.COLS||r<0||r>=this.ROWS) continue;
        const x0=this.GX+c*CELL, y0=this.GY+r*CELL; ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle='#ff5a5a'; rr(x0+3,y0+3,CELL-6,CELL-6,6); ctx.fill(); ctx.restore(); }
    }
    drawFX();
    // tray of 3
    for(let i=0;i<3;i++){ const rrc=this.traySlotRect(i), has=i<this.tray.length, on=this.sel===i;
      ctx.save(); ctx.globalAlpha=has?1:0.25;
      rr(rrc.x,rrc.y,rrc.w,rrc.h,8); ctx.fillStyle=on?p.acc+'44':'rgba(0,0,0,0.35)'; ctx.fill();
      ctx.strokeStyle=on?p.glow:p.ring+'66'; ctx.lineWidth=on?2.5:1.5; rr(rrc.x,rrc.y,rrc.w,rrc.h,8); ctx.stroke();
      if(has){ const s=this.SHAPES[this.tray[i]], cells=on?this.orisFor(this.tray[i])[this.rot%this.orisFor(this.tray[i]).length]:this.ORIS[this.tray[i]][0];
        this.drawPiece(rrc.x+rrc.w/2,rrc.y+rrc.h/2-4,cells,13,s.col,1);
        ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='5px "Press Start 2P"'; ctx.textAlign='center'; ctx.fillText(s.name,rrc.x+rrc.w/2,rrc.y+rrc.h-6); }
      ctx.restore();
    }
    // ROTATE button (drawn, rule 4) — dim when nothing held
    const rb=this.rotRect(), canRot=this.sel>=0&&this.orisFor(this.tray[this.sel]).length>1;
    ctx.save(); ctx.globalAlpha=this.sel>=0?(canRot?1:0.5):0.35;
    rr(rb.x,rb.y,rb.w,rb.h,10); ctx.fillStyle=p.acc+'55'; ctx.fill();
    ctx.strokeStyle=p.ring; ctx.lineWidth=2; rr(rb.x,rb.y,rb.w,rb.h,10); ctx.stroke();
    const rcx=rb.x+22, rcy=rb.y+rb.h/2; // circular arrow
    ctx.strokeStyle=p.glow; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(rcx,rcy,9,-0.4,Math.PI*1.5); ctx.stroke();
    const ex=rcx+Math.cos(Math.PI*1.5)*9, ey=rcy+Math.sin(Math.PI*1.5)*9; ctx.fillStyle=p.glow;
    ctx.beginPath(); ctx.moveTo(ex,ey-1); ctx.lineTo(ex-5,ey-4); ctx.lineTo(ex-1,ey+4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='9px "Press Start 2P"'; ctx.textAlign='left'; ctx.fillText('ROTATE',rb.x+40,rcy+3);
    ctx.restore();
    // banner (FRESH! / HEAT ESCAPED!)
    if(this.banner){ const b=this.banner, a2=Math.min(1,b.life*2);
      ctx.save(); ctx.globalAlpha=a2; ctx.textAlign='center'; ctx.font='12px "Press Start 2P"';
      ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=16; ctx.fillText(b.t,W/2,132); ctx.restore(); }
    // rank
    const rk=rankFor(this.ranks,this.score);
    ctx.textAlign='center'; ctx.font='7px "Press Start 2P"'; ctx.fillStyle=p.ring; ctx.fillText(rk.t,W/2,H-30);
    const nx=nextRank(this.ranks,this.score);
    if(nx){ ctx.font='5px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillText((nx.s-this.score)+' TO '+nx.t,W/2,H-16); }
    ctx.restore();
    if(this.st==='ready') drawReadyScreen(p,'DAIRY WARMER',['TAP A PASTRY TO PICK IT UP','TAP ROTATE TO TURN IT','TAP A SHELF CELL TO PLACE','FILL A ROW TO SERVE IT FRESH']);
    if(this.st==='over') drawOverScreen(p,'WARMER WENT COLD',this.score,this.best,this.newBest,rankFor(this.ranks,this.score).t,'ROWS '+this.rowsCleared+' · SERVED '+this.served);
  },
  tap(x,y){
    if(this.st==='ready'){ this.start(); return; }
    if(this.st==='over'){ if(performance.now()-this.overAt>450){ this.init(); this.start(); } return; }
    // ROTATE button
    if(inR(x,y,this.rotRect())){
      if(this.sel>=0){ const n=this.orisFor(this.tray[this.sel]).length; if(n>1){ this.rot=(this.rot+1)%n; sTick(0.04); buzz(6); } else { this.rejectAt=performance.now(); } }
      else this.rejectAt=performance.now(); // nothing held → free no-op
      return;
    }
    // tray select
    for(let i=0;i<this.tray.length;i++){ if(inR(x,y,this.traySlotRect(i))){ this.sel=i; this.rot=0; this.reject=null; sTick(0.05); buzz(6); return; } }
    // shelf place
    const CELL=this.CELL, col=Math.floor((x-this.GX)/CELL), row=Math.floor((y-this.GY)/CELL);
    if(col>=0&&col<this.COLS&&row>=0&&row<this.ROWS){
      if(this.sel>=0) this.place(col,row);
      else this.rejectAt=performance.now(); // no piece held → free no-op
      return;
    }
    this.rejectAt=performance.now(); // stray tap = free no-op
  }
};

// ════════════════════════════════════════════════════════════════
//  GAME: WEAVER  (Phase 5.5, Unit 7 — the last Phase 5 game)
//  1995 America's Cup red socks. Verb: CONTINUOUS DRAG — the only
//  full pointer-stream consumer (press+drag+release all live, D12).
//  Weave the red thread through EVERY knot exactly once, following
//  the ropes, never crossing yourself, dodging spy boats + flares.
//
//  D16 — the graph is generated correct-by-construction, never
//  generate-and-hope: "visit every node once" is a HAMILTONIAN PATH,
//  which is NP-hard to find in a random graph and would produce
//  impossible daily boards. So genBoard() INVERTS the problem: carve
//  a random simple path on a virtual 4×4 grid first (randomised DFS
//  with backtracking — same generator DNA as GUNGE's carve()), then
//  let the CARVED CELLS BECOME THE KNOTS. The carve order is then a
//  Hamiltonian path over the knot set by definition. Decoy ropes are
//  added AFTER, between grid-adjacent knots that aren't consecutive
//  on the carve — legal to follow, and the trap. Because consecutive
//  carve cells are grid-adjacent and jitter is bounded below half a
//  cell, the solution path can never geometrically self-cross, so
//  the no-cross rule can't invalidate the intended solution either.
//
//  Thread moves are EDGE-CONSTRAINED (a rope must exist) and the
//  thread may only START on one of the two carved endpoints (the red
//  bollards) — the Hamiltonian guarantee holds from the endpoints
//  ONLY; a free-start could strand the player on a provably
//  unwinnable attempt, which would break D16's spirit.
//
//  Lives are HAZARD-ONLY (§5.5): boat/flare contact snaps the thread
//  = 1 life, 3 lives = over (D14). Everything else is free (§8):
//  pressing off a bollard, a blocked rope, releasing an unfinished
//  weave (it just unravels — retry the same board), dragging back
//  onto the previous knot (unwinds one step). The per-board clock is
//  a BONUS METER only (GUNGE precedent, D3): completion banks the
//  remainder, hitting 0 never costs anything — the board stays
//  finishable for base points.
//
//  Self-crossing uses segsCross (proper seg-seg orientation test —
//  segDist is the wrong primitive for that); hazard-vs-thread uses
//  segDist exactly as §3 intends. pointercancel routes through the
//  router to release(), which unconditionally nulls the thread — an
//  abandoned drag can never hang a weave (§3). Seeded via srnd():
//  carve, jitter, decoys, boat routes, flare routes — Nth-draw order
//  is deterministic (HOWLER precedent), drag physics stay live.
//  (Section labels track FILE order, not the daily order — §7.)
// ════════════════════════════════════════════════════════════════
const WEAVER={
  id:'weaver', name:'WEAVER', tag:'WEAVE THE RED THREAD',
  bestKey:'arc_weaver_best',
  // par PROVISIONAL & SIM-INFORMED (no human play). A modelled player (solve time
  // ~L·1.1s+2s/attempt, snap chance 0.10+0.045/stage) over 4000 runs: score
  // p10/p50/p90 ≈ 310/1000/2600, median run ≈2.6 min, median stage 7. The spec's
  // par:200 would peg the 625 normaliser cap for anyone reaching stage 4 (the
  // GUNGE/TAZO/DAIRY par lesson, applied up front); par:1000 lands the modelled
  // median at ≈250 normalised with only p90+ runs touching the cap. The player
  // model is a guess — flip CALIBRATE on to log real runs and retune (§7).
  par:1000, // PROVISIONAL
  ranks:[{s:0,t:'SOCK KNITTER'},{s:120,t:'DECKHAND'},{s:400,t:'TACTICIAN'},{s:900,t:'HELMSMAN'},{s:1800,t:'CUP HOLDER'}], // PROVISIONAL
  CALIBRATE:false,      // flip on → log score/stage/knits/seconds per run (par retune data, §7)
  GX:30, GY:168, GRID_PX:300, GN:4,   // virtual 4×4 grid, 75px cells, board box 300×300
  BASE_NODES:7, MAX_NODES:14,         // knots per board: 7 + stage, capped — PROVISIONAL
  DECOY_BASE:2, DECOY_MAX:6,          // decoy ropes: 2 + stage, capped — PROVISIONAL
  // Snap geometry: cell 75 ≥ 2·SNAP_R + 2·JITTER = 72, so snap circles of
  // neighbouring knots can NEVER overlap (min knot spacing 75−2·12 = 51 > 48).
  // Widen SNAP_R or JITTER only together with this inequality.
  SNAP_R:24, JITTER:12,
  THREAD_W:3.5,
  TIME_BASE:30, TIME_STEP:1.5, TIME_FLOOR:14, // bonus meter only — never ends anything (D3) — PROVISIONAL
  NODE_PTS:3, TIME_RATE:1,            // gained = knots·NODE_PTS·(stage+1) + remaining·TIME_RATE — PROVISIONAL
  BOAT_SPD:52, BOAT_SPD_STEP:6, BOAT_R:11,          // px/s along the patrol box — PROVISIONAL
  FLARE_PERIOD:7, FLARE_PERIOD_MIN:3.5, FLARE_T:1.6, FLARE_R:9, // PROVISIONAL
  pal(){ return PALS[9]; }, // navy hull + red-sock accent (hues PROVISIONAL, §3/§7)
  stageTime(){ return Math.max(this.TIME_FLOOR, this.TIME_BASE-this.stage*this.TIME_STEP); },
  flarePeriod(){ return Math.max(this.FLARE_PERIOD_MIN, this.FLARE_PERIOD-this.stage*0.5); },
  // B1 fix (§3 determinism model): WEAVER overrides the generic seed so the
  // daily can SPLIT its seeded draws. From ONE fixed draw (taken before any
  // board or hazard draw) we derive a stable integer base; genBoard/rollBoats
  // then run on a per-stage board stream (fixed draw count ⇒ identical boards
  // for everyone) while spawnFlare runs on a separate hazard stream (Nth flare
  // route stays shared). Free play (rng null) ⇒ Math.random throughout.
  seed(rng){ this.srng=rng||null; this.dailySeed = rng ? (rng()*4294967296)>>>0 : null; },
  brnd(){ return this.boardRng ? this.boardRng() : Math.random(); }, // board/piece draws
  hrnd(){ return this.hazRng ? this.hazRng() : Math.random(); },     // hazard draws
  init(){
    this.score=0; this.best=loadBest(this.bestKey); this.newBest=false;
    this.lives=3; this.stage=0; this.knits=0; this.runT=0;
    this.thread=null; this.px=0; this.py=0;
    this.shake=0; this.banner=null; this.rejectAt=0;
    this.st='ready'; this.overAt=0;
    parts=[]; pops=[];
    // Free play (srng null — set directly by the menu, bypassing seed()) clears
    // any daily base left over; the hazard stream is created once per run.
    if(!this.srng) this.dailySeed=null;
    this.hazRng = this.dailySeed!=null ? mulberry32((this.dailySeed ^ hashStr('weaver-haz'))>>>0) : null;
    this.genBoard();
  },
  start(){ this.st='play'; },
  // ── D16 generation: Hamiltonian path FIRST, knots FROM the path ──
  carve(L){ // random simple path of exactly L cells on the GN×GN grid
    const N=this.GN, total=N*N, self=this;
    const first=Math.floor(this.brnd()*total);
    for(let s0=0;s0<total;s0++){ // fallback starts, deterministic order — carve can't fail
      const seen=new Array(total).fill(false), path=[];
      function dfs(idx){
        seen[idx]=true; path.push(idx);
        if(path.length===L) return true;
        const c=idx%N, r=(idx/N)|0, ds=[[0,-1],[1,0],[0,1],[-1,0]];
        for(let i=ds.length-1;i>0;i--){ const j=Math.floor(self.brnd()*(i+1)); const t=ds[i]; ds[i]=ds[j]; ds[j]=t; }
        for(const [dc,dr] of ds){ const nc=c+dc, nr=r+dr;
          if(nc<0||nc>=N||nr<0||nr>=N) continue;
          const n=nr*N+nc; if(!seen[n]&&dfs(n)) return true; }
        path.pop(); seen[idx]=false; return false;
      }
      if(dfs((first+s0)%total)) return path;
    }
    return [first]; // unreachable for L ≤ MAX_NODES ≤ 14 on a 4×4 grid; keeps the contract total
  },
  genBoard(){
    // B1 fix (§3): board draws (carve/jitter/decoys/boats) run on a per-stage
    // stream with a FIXED draw count, so boards 1..k are byte-identical for every
    // player regardless of weave pace; flares draw from the separate hazard
    // stream (spawnFlare). Free play ⇒ Math.random via brnd()/hrnd().
    this.boardRng = this.dailySeed!=null ? mulberry32((this.dailySeed ^ hashStr('weaver-board') ^ Math.imul(this.stage+1,2654435761))>>>0) : null;
    const L=Math.min(this.MAX_NODES,this.BASE_NODES+this.stage);
    const cells=this.carve(L), N=this.GN, cs=this.GRID_PX/N;
    this.nodes=cells.map(idx=>({
      x:this.GX+(idx%N)*cs+cs/2+(this.brnd()*2-1)*this.JITTER,
      y:this.GY+((idx/N)|0)*cs+cs/2+(this.brnd()*2-1)*this.JITTER,
      cell:idx }));
    // ropes: the true path (i,i+1) + seeded decoys (grid-adjacent, NOT consecutive)
    this.adj=this.nodes.map(()=>[]);
    const addE=(a,b)=>{ this.adj[a].push(b); this.adj[b].push(a); };
    for(let i=0;i<L-1;i++) addE(i,i+1);
    const cand=[];
    for(let i=0;i<L;i++) for(let j=i+2;j<L;j++){
      const a=this.nodes[i].cell, b=this.nodes[j].cell;
      if(Math.max(Math.abs(a%N-b%N),Math.abs(((a/N)|0)-((b/N)|0)))===1) cand.push([i,j]);
    }
    for(let i=cand.length-1;i>0;i--){ const j=Math.floor(this.brnd()*(i+1)); const t=cand[i]; cand[i]=cand[j]; cand[j]=t; }
    const nd=Math.min(cand.length, Math.min(this.DECOY_MAX,this.DECOY_BASE+this.stage));
    for(let k=0;k<nd;k++) addE(cand[k][0],cand[k][1]);
    this.ends=[0,L-1]; // the ONLY legal thread starts — the Hamiltonian guarantee holds from these
    this.thread=null;
    this.timeLeft=this.stageTime();
    this.rollBoats(); this.flare=null; this.flareT=this.flarePeriod()*0.6;
  },
  rollBoats(){
    const n=Math.min(3,1+(this.stage>=2?1:0)+(this.stage>=5?1:0));
    this.boats=[];
    for(let i=0;i<n;i++){
      const w=110+this.brnd()*140, h=90+this.brnd()*140; // patrol box never degenerate — a tight loop would camp a knot
      this.boats.push({ x:this.GX+this.brnd()*(this.GRID_PX-w), y:this.GY+this.brnd()*(this.GRID_PX-h),
        w,h, t:this.brnd(), dir:this.brnd()<0.5?1:-1, spd:this.BOAT_SPD+this.stage*this.BOAT_SPD_STEP });
    }
  },
  boatPos(b){ // position + heading along the patrol-box perimeter
    const per=2*(b.w+b.h); let d=(((b.t%1)+1)%1)*per;
    let p;
    if(d<b.w) p={x:b.x+d,y:b.y,a:0};
    else if((d-=b.w)<b.h) p={x:b.x+b.w,y:b.y+d,a:Math.PI/2};
    else if((d-=b.h)<b.w) p={x:b.x+b.w-d,y:b.y+b.h,a:Math.PI};
    else { d-=b.w; p={x:b.x,y:b.y+b.h-d,a:-Math.PI/2}; }
    if(b.dir<0) p.a+=Math.PI;
    return p;
  },
  spawnFlare(){ // arcs across the board top↔bottom
    // B1 fix (§3 determinism model): flares draw from the HAZARD stream (hrnd),
    // NEVER the board stream. Flare count before a board completes depends on
    // weave pace, so mixing these draws with board generation is exactly what
    // drifted boards 2+ between players. The Nth flare's route is still shared.
    const fromTop=this.hrnd()<0.5;
    this.flare={ t:0, dur:this.FLARE_T,
      x0:this.GX+this.hrnd()*this.GRID_PX, x1:this.GX+this.hrnd()*this.GRID_PX,
      y0:fromTop?this.GY-14:this.GY+this.GRID_PX+14,
      y1:fromTop?this.GY+this.GRID_PX+14:this.GY-14 };
  },
  flarePos(f){ const u=f.t/f.dur; return {x:f.x0+(f.x1-f.x0)*u, y:f.y0+(f.y1-f.y0)*u-Math.sin(Math.PI*u)*46}; },
  // ── pointer stream (D12) — press+drag+release, the full contract ──
  press(x,y){
    this.px=x; this.py=y;
    for(const e of this.ends){ const n=this.nodes[e];
      if(Math.hypot(x-n.x,y-n.y)<this.SNAP_R){
        this.thread={order:[e], visited:new Array(this.nodes.length).fill(false)};
        this.thread.visited[e]=true; sTick(0.05); buzz(6); return;
      }
    }
    this.rejectAt=performance.now(); // off-bollard press = free no-op (§8)
  },
  drag(x,y){
    this.px=x; this.py=y;
    const th=this.thread; if(!th) return;
    const cur=th.order[th.order.length-1];
    if(th.order.length>1){ // unwind: dragging back onto the previous knot pops a step
      const pn=this.nodes[th.order[th.order.length-2]];
      if(Math.hypot(x-pn.x,y-pn.y)<this.SNAP_R){ th.visited[cur]=false; th.order.pop(); sTick(0.02); return; }
    }
    for(const nb of this.adj[cur]){
      if(th.visited[nb]) continue;
      const n=this.nodes[nb];
      if(Math.hypot(x-n.x,y-n.y)>=this.SNAP_R) continue;
      if(this.crossesThread(cur,nb)){ this.rejectAt=performance.now(); continue; } // blocked rope = free (§8), visual only
      th.order.push(nb); th.visited[nb]=true; sTick(0.05); buzz(4);
      if(th.order.length===this.nodes.length) this.complete();
      return;
    }
  },
  release(){
    // ALWAYS terminates the gesture — pointercancel lands here via the router
    // (§3: an abandoned drag must never hang a weave). An unfinished thread
    // unravels as a FREE retry on the same board (§8: lives are hazard-only).
    if(this.thread) sTick(0.02);
    this.thread=null;
  },
  crossesThread(a,b){ // would knot a → knot b cross any committed segment?
    const th=this.thread, A=this.nodes[a], B=this.nodes[b];
    for(let i=0;i<th.order.length-2;i++){ // skip the last segment — it shares knot a
      const P=this.nodes[th.order[i]], Q=this.nodes[th.order[i+1]];
      if(segsCross(A.x,A.y,B.x,B.y,P.x,P.y,Q.x,Q.y)) return true;
    }
    return false;
  },
  threadSegs(){ // committed segments + the live rubber-band to the pointer
    const th=this.thread, out=[];
    for(let i=0;i<th.order.length-1;i++){ const a=this.nodes[th.order[i]], b=this.nodes[th.order[i+1]]; out.push([a.x,a.y,b.x,b.y]); }
    const c0=this.nodes[th.order[th.order.length-1]];
    out.push([c0.x,c0.y,this.px,this.py]);
    return out;
  },
  complete(){
    this.thread=null;
    const gained=this.nodes.length*this.NODE_PTS*(this.stage+1)+Math.round(this.timeLeft)*this.TIME_RATE;
    this.score+=gained; this.knits++;
    if(this.score>this.best){ this.best=this.score; this.newBest=true; saveBest(this.bestKey,this.score); }
    const n=this.nodes[this.nodes.length-1];
    burst(n.x,n.y,this.pal().glow,18,4); burst(n.x,n.y,'#ffd2d8',8,2.6);
    pop('+'+gained,n.x,n.y-20,this.pal().ring,8);
    sGold(); buzz(20); this.shake=6; this.banner={t:'KNITTED!',life:1.3};
    if(this.CALIBRATE) console.log('WEAVER knit: stage='+(this.stage+1)+' gained='+gained+' left='+this.timeLeft.toFixed(1));
    this.stage++; this.genBoard();
  },
  snap(hx,hy){ // hazard contact: the thread snaps = 1 life (§5.5)
    this.thread=null; this.lives--;
    burst(hx,hy,'#ff4458',16,3.6); pop('SNAPPED!',hx,hy-16,this.pal().ring,8);
    sBad(); buzz(50); this.shake=8; this.banner={t:'THREAD SNAPPED!',life:1.3};
    if(this.lives<=0) this.gameOver();
  },
  gameOver(){
    this.st='over'; this.overAt=performance.now(); this.thread=null;
    if(this.CALIBRATE) console.log('WEAVER run: score='+this.score+' stage='+(this.stage+1)+' knits='+this.knits+' t='+this.runT.toFixed(1)+'s');
    if(this.onOver) this.onOver();
  },
  update(dt){
    this.shake*=0.82;
    if(this.banner){ this.banner.life-=dt*0.7; if(this.banner.life<=0) this.banner=null; }
    if(this.st!=='play') return;
    this.runT+=dt;
    this.timeLeft=Math.max(0,this.timeLeft-dt); // bonus drains to 0 and stops — no penalty (D3)
    for(const b of this.boats){ b.t+=b.dir*b.spd*dt/(2*(b.w+b.h)); }
    if(this.flare){ this.flare.t+=dt; if(this.flare.t>=this.flare.dur) this.flare=null; }
    else { this.flareT-=dt; if(this.flareT<=0){ this.spawnFlare(); this.flareT=this.flarePeriod(); } }
    if(this.thread){ // hazards only threaten a LIVE thread — timing the weave is the game
      const pts=this.boats.map(b=>{ const p=this.boatPos(b); p.r=this.BOAT_R; return p; });
      if(this.flare){ const p=this.flarePos(this.flare); p.r=this.FLARE_R; pts.push(p); }
      const segs=this.threadSegs();
      for(const p of pts) for(const s of segs){
        if(segDist(p.x,p.y,s[0],s[1],s[2],s[3])<p.r+this.THREAD_W){ this.snap(p.x,p.y); return; }
      }
    }
  },
  // ── drawing ──
  drawBoat(b){
    const p=this.boatPos(b);
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
    ctx.fillStyle='#101820'; // hull, bow forward (+x)
    ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(4,5); ctx.lineTo(-10,5); ctx.lineTo(-12,0); ctx.lineTo(-10,-5); ctx.lineTo(4,-5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.85)'; // spy sail
    ctx.beginPath(); ctx.moveTo(-1,-4); ctx.lineTo(7,-4); ctx.lineTo(-1,-14); ctx.closePath(); ctx.fill();
    ctx.restore();
  },
  drawFlare(f){
    const p=this.flarePos(f);
    ctx.save(); ctx.shadowColor='#ffcc44'; ctx.shadowBlur=12;
    for(let i=1;i<=3;i++){ const u=Math.max(0,f.t-i*0.05)/f.dur; // short trail
      const tx=f.x0+(f.x1-f.x0)*u, ty=f.y0+(f.y1-f.y0)*u-Math.sin(Math.PI*u)*46;
      ctx.globalAlpha=0.5-i*0.13; ctx.fillStyle='#ff9a30'; ctx.beginPath(); ctx.arc(tx,ty,4-i,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1; ctx.fillStyle='#ffe28a'; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  },
  render(){
    const p=this.pal();
    ctx.save();
    if(this.shake>0.4) ctx.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake*0.7);
    drawBG(p);
    // HUD
    ctx.textAlign='center';
    ctx.font='26px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=14;
    ctx.fillText(this.score,W/2,76); ctx.shadowBlur=0;
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fillText('BEST '+this.best,W/2,96);
    for(let i=0;i<3;i++){ const lx=W/2-26+i*26; ctx.save(); ctx.globalAlpha=i<this.lives?1:0.18; // lives as tiny red socks (rule 4)
      ctx.fillStyle=p.acc; rr(lx-4,104,8,10,2); ctx.fill(); rr(lx-4,111,11,5,2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.7)'; rr(lx-4,104,8,3,1); ctx.fill(); ctx.restore(); }
    ctx.font='6px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.fillText('STAGE '+(this.stage+1),W/2,130);
    // bonus clock (a bonus meter, not a cap — D3)
    const bx=44, bw=W-88, frac=Math.max(0,Math.min(1,this.timeLeft/this.stageTime()));
    rr(bx-1,137,bw+2,8,3); ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fill();
    ctx.fillStyle=frac<0.25?'rgba(255,255,255,0.35)':p.ring;
    rr(bx,138,Math.max(0,bw*frac),6,2); ctx.fill();
    // water shimmer inside the course
    ctx.save(); ctx.strokeStyle='rgba(120,180,255,0.07)'; ctx.lineWidth=2;
    for(let i=0;i<5;i++){ const wy=this.GY+30+i*58; ctx.beginPath();
      for(let x=this.GX;x<=this.GX+this.GRID_PX;x+=20) ctx.lineTo(x,wy+Math.sin(tick*0.03+i*1.7+x*0.05)*3);
      ctx.stroke(); }
    ctx.restore();
    // ropes (path + decoys drawn identically — telegraphing the carve would kill the puzzle)
    ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=2; ctx.lineCap='round';
    for(let a=0;a<this.adj.length;a++) for(const b of this.adj[a]) if(b>a){
      const A=this.nodes[a], B=this.nodes[b];
      ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
    }
    // thread (committed + live rubber-band)
    const th=this.thread;
    if(th){
      ctx.save(); ctx.strokeStyle=p.glow; ctx.shadowColor=p.glow; ctx.shadowBlur=10;
      ctx.lineWidth=this.THREAD_W; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath();
      th.order.forEach((ni,i)=>{ const n=this.nodes[ni]; if(i===0) ctx.moveTo(n.x,n.y); else ctx.lineTo(n.x,n.y); });
      ctx.stroke();
      ctx.globalAlpha=0.55; ctx.beginPath();
      const c0=this.nodes[th.order[th.order.length-1]];
      ctx.moveTo(c0.x,c0.y); ctx.lineTo(this.px,this.py); ctx.stroke();
      ctx.restore();
    }
    // knots (drawn, rule 4): cleat discs; bollard endpoints in red; visited fill
    this.nodes.forEach((n,i)=>{
      const isEnd=i===this.ends[0]||i===this.ends[1];
      const vis=th&&th.visited[i], cur=th&&i===th.order[th.order.length-1];
      ctx.beginPath(); ctx.arc(n.x,n.y,isEnd?10:8,0,Math.PI*2); ctx.fillStyle='#060d18'; ctx.fill();
      ctx.save();
      if(cur){ ctx.shadowColor=p.glow; ctx.shadowBlur=12; }
      else if(isEnd&&!th){ ctx.shadowColor=p.glow; ctx.shadowBlur=6+4*Math.sin(tick*0.08); }
      ctx.beginPath(); ctx.arc(n.x,n.y,isEnd?7:5.5,0,Math.PI*2);
      ctx.fillStyle=vis?p.acc:(isEnd?p.ring:'#3a4d68'); ctx.fill();
      ctx.restore();
      ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(n.x,n.y,isEnd?7:5.5,0,Math.PI*2); ctx.stroke();
    });
    // hazards
    this.boats.forEach(b=>this.drawBoat(b));
    if(this.flare) this.drawFlare(this.flare);
    drawFX();
    // progress + reject flash + banner
    if(th){ ctx.textAlign='center'; ctx.font='6px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.fillText(th.order.length+' / '+this.nodes.length+' KNOTS',W/2,this.GY+this.GRID_PX+24); }
    if(this.rejectAt&&performance.now()-this.rejectAt<200){ ctx.save(); ctx.globalAlpha=0.12; ctx.fillStyle='#ff5a5a'; ctx.fillRect(0,0,W,H); ctx.restore(); }
    if(this.banner){ const b=this.banner, a2=Math.min(1,b.life*2);
      ctx.save(); ctx.globalAlpha=a2; ctx.textAlign='center'; ctx.font='11px "Press Start 2P"';
      ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=16; ctx.fillText(b.t,W/2,160); ctx.restore(); }
    // rank
    const rk=rankFor(this.ranks,this.score);
    ctx.textAlign='center'; ctx.font='7px "Press Start 2P"'; ctx.fillStyle=p.ring; ctx.fillText(rk.t,W/2,H-42);
    const nx=nextRank(this.ranks,this.score);
    if(nx){ ctx.font='5px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillText((nx.s-this.score)+' TO '+nx.t,W/2,H-26); }
    ctx.restore();
    if(this.st==='ready') drawReadyScreen(p,'WEAVER',['DRAG FROM A RED BOLLARD','THREAD EVERY KNOT ONCE','FOLLOW ROPES · NEVER CROSS','DODGE SPY BOATS AND FLARES']);
    if(this.st==='over') drawOverScreen(p,'THE THREAD SNAPPED',this.score,this.best,this.newBest,rankFor(this.ranks,this.score).t,'STAGE '+(this.stage+1)+' · KNITS '+this.knits);
  },
  tap(){ // gameplay never routes here (press defined, D12) — ready/over only
    if(this.st==='ready'){ this.start(); return; }
    if(this.st==='over'&&performance.now()-this.overAt>450){ this.init(); this.start(); }
  }
};

// ════════════════════════════════════════════════════════════════
//  MENU + ROUTER
// ════════════════════════════════════════════════════════════════
const GAMES=[STACK,SCAN,HOWLER,SWINGBALL,GUNGE,CHATTER,TAZO,SCRAMBLE,DAIRY,KNUCKLEBONES,WEAVER]; // daily order (the TUCK SHOP RUN sequence) — §5.6: HOWLER after SCAN, GUNGE after SWINGBALL, TAZO after CHATTER, DAIRY after SCRAMBLE, WEAVER last
// ── Per-game menu/gauntlet palette — the ONE source of truth (§7). ─
// Adding a game = add ONE line here. drawMenu, the gauntlet end-card, and
// the persisted daily pid all read through gamePal/PALMAP, so a missing
// entry degrades to the hub palette (PALS[2]) instead of throwing and
// freezing the whole frame loop (the crash that shipped with GUNGE).
// HOWLER reuses PALS[0] (§5.1); TAZO on PALS[7]; PALS[2] = hub palette.
const PALMAP={stack:0,scan:1,howler:0,swing:3,gunge:6,chatter:3,tazo:7,scramble:4,dairy:8,bones:5,weaver:9};
function gamePal(id){ const i=PALMAP[id]; return PALS[i!=null?i:2]; }
let mode='menu', cur=null, paused=false, menuPage=0;
let tick=0, lastT=0;
// Telemetry (6.0): the active game's play→over transition is detected centrally
// in frame() so every run — free play AND daily — records exactly once. lastMode
// gates the menu-entry arc_stats console dump.
let telemStartAt=null, lastMode=null;
GAMES.forEach(g=>g.init());
// Daily content-seeding: each game accepts a seeded PRNG; srng=null ⇒ free play (Math.random).
// Content-seeding only (spawn/zone/toss/mix) — physics & cosmetics stay live (see srnd()).
GAMES.forEach(g=>{ g.srng=null; if(!g.seed) g.seed=function(rng){ this.srng=rng||null; }; });

// The daily. Working name TUCK SHOP RUN (owner pick). Other 90s-NZ candidates
// the owner floated: PLAYLUNCH, THE TUCK RUN, MORNING TEA, AFTER THE BELL.
const DAILY_NAME='TUCK SHOP RUN';
const DAILY_EPOCH='2026-07-16'; // day 1 = ship date; #N counts from here (local time)
function dailyNumber(){ return Math.floor((Date.parse(dayKeyOf(new Date()))-Date.parse(DAILY_EPOCH))/86400000)+1; }
function dailyPlayedToday(){ let st=null; try{ st=JSON.parse(localStorage.getItem('arc_daily_state')||'null'); }catch(e){} return !!(st&&st.dayKey===dayKeyOf(new Date())&&st.played); }

// ════════════════════════════════════════════════════════════════
//  GAUNTLET  (Phase 3 — every game, one score)
//  Sequences all games to first game-over via each game's onOver hook,
//  normalises each score against game.par (÷par ×250, cap 625), and
//  renders interstitials + an end card. Lives outside the game contract;
//  reads only public fields and never mutates game internals.
// ════════════════════════════════════════════════════════════════
const GAUNTLET={
  // Daily-only (Phase 4.5 R3): the free-play gauntlet is gone — TUCK SHOP RUN is the only gauntlet.
  CAP:625, NORM:250,
  // palette lookup uses the module-level PALMAP/gamePal (§7 single source of truth)
  contribOf(score,par){ return Math.min(this.CAP,Math.round(score/(par||1)*this.NORM)); },
  beginDaily(){
    const dk=dayKeyOf(new Date());
    this.toast=null; this.dayKey=dk;
    this.dailyN=dailyNumber();
    this.streak=loadBest('arc_daily_streak');
    let st=null; try{ st=JSON.parse(localStorage.getItem('arc_daily_state')||'null'); }catch(e){}
    mode='gauntlet'; paused=false;
    if(st && st.dayKey===dk && st.played){
      // one attempt per day already used — show the locked result (or forfeit notice)
      this.locked=true;
      this.total=st.total||0;
      this.results=(st.result||[]).map(r=>({name:r.name, contrib:r.contrib, rank:r.rank, pal:PALS[r.pid!=null?r.pid:2]}));
      this.emojiGrid=st.emojiGrid||'';
      this.state='end'; this.overAt=performance.now();
      return;
    }
    // consume the attempt now: bailing mid-run forfeits the day (true one-attempt)
    this.locked=false; this.order=GAMES; this.idx=0; this.total=0; this.results=[];
    this.runStartAt=performance.now(); // whole-run length for telemetry (6.0)
    this.seedBase=hashStr(dk);
    saveStr('arc_daily_state',JSON.stringify({dayKey:dk,played:true}));
    this.launch();
  },
  launch(){
    cur=this.order[this.idx];
    cur.seed(mulberry32(this.seedBase + this.idx*101)); // always seeded — daily is the only gauntlet
    cur.init();
    cur.onOver=()=>this.capture();   // game runs its own ready→play→over
    this.state='playing';
  },
  capture(){
    const g=cur, score=Math.floor(g.score||0);
    this.results.push({name:g.name, id:g.id, score, contrib:this.contribOf(score,g.par), rank:rankFor(g.ranks,score).t, pal:gamePal(g.id)});
    this.total+=this.results[this.results.length-1].contrib;
    g.onOver=null;                    // one-shot — guards double-fire
    this.overAt=performance.now();
    if(this.idx>=this.order.length-1) this.finish();
    else { this.state='interstitial'; sStage(); }
  },
  advance(){ this.idx++; this.launch(); },
  finish(){
    this.state='end'; this.overAt=performance.now();
    // streak: +1 if yesterday was completed, else reset to 1
    const yk=dayKeyOf(new Date(Date.parse(this.dayKey)-86400000));
    this.streak=(loadStr('arc_daily_lastdone')===yk)?loadBest('arc_daily_streak')+1:1;
    saveBest('arc_daily_streak',this.streak); saveStr('arc_daily_lastdone',this.dayKey);
    this.emojiGrid=this.buildEmojiGrid();
    const result=this.results.map(r=>({name:r.name,contrib:r.contrib,rank:r.rank,pid:PALMAP[r.id]!=null?PALMAP[r.id]:2}));
    saveStr('arc_daily_state',JSON.stringify({dayKey:this.dayKey,played:true,total:this.total,result,emojiGrid:this.emojiGrid}));
    if(this.runStartAt!=null){ recordDailyRun(this.total,(performance.now()-this.runStartAt)/1000); this.runStartAt=null; } // whole-run telemetry (6.0)
    refreshDaily(); sGold(); // refresh the tile's cached daily state
  },
  exit(){
    if(cur){ cur.onOver=null; cur.srng=null; }
    cur=null; mode='menu'; paused=false; refreshMenuBests(); refreshDaily();
  },
  forfeited(){ return this.locked && !this.results.length; },
  buildEmojiGrid(){
    const tier=c=>c<100?'⬛':c<200?'🟨':c<350?'🟧':c<500?'🟩':'🟪';
    return this.results.map(r=>tier(r.contrib)).join('');
  },
  shareText(){ return DAILY_NAME+' #'+this.dailyN+'\n'+this.emojiGrid+'\nTOTAL '+this.total+' · STREAK '+this.streak; },
  showToast(t){ this.toast={t,life:1.6}; },
  shareGrid(){
    const txt=this.shareText();
    try{
      if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); this.showToast('SHARED!'); return; }
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>this.showToast('COPIED!'),()=>this.showToast('COPY FAILED')); return; }
    }catch(e){}
    this.showToast('COPY UNAVAILABLE');
  },
