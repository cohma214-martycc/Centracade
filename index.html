  },
  tap(x,y){
    if(this.st==='ready'){ this.start(); return; }
    if(this.st==='over'){
      if(performance.now()-this.overAt>450){ this.init(); this.start(); }
      return;
    }
    let best=null, bestD=Infinity;
    this.activeLive().forEach(s=>{
      const pos=this.slotPos(s);
      const d=Math.hypot(x-pos.x,y-pos.y);
      if(d<this.HIT_R && d<bestD){ best=s; bestD=d; }
    });
    if(best){ this.restrike(best); this.missStreak=0; }
    else { this.missStreak++; if(this.missStreak>=2) this.fumble(); } // single stray tap is free
  }
};

// ════════════════════════════════════════════════════════════════
//  GAME 5: SWINGBALL  (endless tetherball — wind the rope up the pole)
//  Adapted from CHAIN's ring-timing core, but a separate game (D1):
//  a spiral WIND meter is the differentiator; filling it banks a LOOP
//  (score multiplier +1) and steps difficulty up. Only a miss/break ends it.
// ════════════════════════════════════════════════════════════════
const SWINGBALL={
  id:'swing', name:'SWINGBALL', tag:'WIND IT UP',
  spaceTap:true, // positionless — safe to trigger from the spacebar
  bestKey:'arc_swing_best', // fresh key — never inherits CHAIN's history (D1)
  par:40, // PROVISIONAL — retune from play data
  ranks:[{s:0,t:'DRIVEWAY DEBUT'},{s:15,t:'TIP AND RUN'},{s:35,t:'ONE HAND ONE BOUNCE'},{s:60,t:'SIX AND OUT'},{s:100,t:'OVER THE FENCE'},{s:160,t:'AUTO WICKY'},{s:240,t:'JANDAL SLOGGER'},{s:350,t:'BACKYARD TEST LEGEND'}],
  CX:W/2, CY:312, R:104,
  POLE_TOP:120, POLE_BOT:470,
  START_SPEED:1.7, SPEED_INC:0.05, SPEED_CAP:4.2,
  START_ZONE:0.42, ZONE_SHRINK:0.012, ZONE_FLOOR:0.14,
  PERFECT_FRAC:0.33, SLOP:1.7,
  WIND_MAX:100, WIND_HIT:20, WIND_PERFECT:30, WIND_MISS:25,
  LOOP_SPEED_STEP:0.25, LOOP_ZONE_STEP:0.03,
  init(){
    this.baseSpeed=this.START_SPEED; this.baseZone=this.START_ZONE;
    this.angle=-Math.PI/2; this.dir=1; this.speed=this.baseSpeed;
    this.zoneC=wrap(this.angle+2.2); this.zoneHalf=this.baseZone;
    this.wasInside=false;
    this.wind=0; this.loop=0;
    this.score=0; this.hits=0;
    this.timeScale=1; this.shake=0; this.grace=0; this.flash=0;
    this.best=loadBest(this.bestKey); // no legacy arg — no CHAIN inheritance
    this.newBest=false; this.trail=[]; this.ghosts=[]; this.banner=null;
    this.st='ready'; this.overAt=0;
    parts=[]; pops=[];
  },
  pal(){ return PALS[3]; }, // backyard green (gold accents added inline)
  mult(){ return 1+this.loop; },
  start(){ this.st='play'; },
  ballPos(a){ return {x:this.CX+Math.cos(a)*this.R, y:this.CY+Math.sin(a)*this.R}; },
  windHeight(){ return this.POLE_BOT-(this.POLE_BOT-this.POLE_TOP)*(this.wind/this.WIND_MAX); },
  placeZone(){
    this.zoneC=wrap(this.angle+this.dir*(1.35+Math.random()*3.0));
    this.wasInside=false;
  },
  bankLoop(){
    this.loop++; this.wind=0; this.flash=1;
    this.baseSpeed=Math.min(this.SPEED_CAP,this.baseSpeed+this.LOOP_SPEED_STEP);
    this.baseZone=Math.max(this.ZONE_FLOOR,this.baseZone-this.LOOP_ZONE_STEP);
    this.speed=this.baseSpeed; this.zoneHalf=this.baseZone;
    this.timeScale=0.35; this.grace=0.3; // grace through the slow-mo (mirrors CHAIN)
    this.banner={t:'LOOP ×'+this.mult()+'!',life:1.5};
    burst(this.CX,this.CY,'#ffd24a',24,5); burst(this.CX,this.CY,'#fff',8,3);
    sStage(); buzz(30); this.shake=6;
  },
  clean(d){
    const perfect=Math.abs(d)<=this.zoneHalf*this.PERFECT_FRAC;
    const gain=(perfect?2:1)*this.mult();
    this.score+=gain;
    if(this.score>this.best){ this.best=this.score; this.newBest=true; saveBest(this.bestKey,this.best); }
    this.hits++;
    const pos=this.ballPos(this.angle);
    this.ghosts.push({a:this.zoneC,life:1,c:perfect?'#ffffff':this.pal().glow});
    if(perfect){ burst(pos.x,pos.y,'#ffffff',12,3.6); pop('PERFECT +'+gain,pos.x,pos.y-26,'#ffffff',7); sPerfect(); buzz(18); }
    else { burst(pos.x,pos.y,this.pal().glow,9,2.8); pop('+'+gain,pos.x,pos.y-24,this.pal().ring,7); sHit(); buzz(12); }
    this.speed=Math.min(this.SPEED_CAP,this.speed+this.SPEED_INC);
    this.zoneHalf=Math.max(this.ZONE_FLOOR,this.zoneHalf-this.ZONE_SHRINK);
    this.wind+=perfect?this.WIND_PERFECT:this.WIND_HIT;
    if(this.wind>=this.WIND_MAX) this.bankLoop();
    this.dir*=-1;
    this.placeZone();
  },
  mistime(){
    const pos=this.ballPos(this.angle);
    this.wind=Math.max(0,this.wind-this.WIND_MISS); // rope unwinds, but you survive
    burst(pos.x,pos.y,'#ff9a3a',7,2.4);
    pop('UNWIND',pos.x,pos.y-22,'#ff9a3a',6);
    beep(300,0.12,'sawtooth',0.04,180); buzz(10);
    this.shake=Math.max(this.shake,3);
    this.dir*=-1;
    this.placeZone();
  },
  breakRope(){
    if(this.grace>0) return; // loop-bank grace period: no breaks
    const pos=this.ballPos(this.angle);
    burst(pos.x,pos.y,'#ff4455',22,5); burst(pos.x,pos.y,'#fff',8,3);
    this.shake=10; sBad(); buzz(70);
    this.overAt=performance.now(); this.st='over';
    if(this.onOver) this.onOver();
  },
  update(dt){
    this.timeScale+=(1-this.timeScale)*0.055;
    this.shake*=0.82;
    if(this.flash>0) this.flash-=0.04;
    if(this.grace>0) this.grace-=dt;
    if(this.st==='play'){
      // overshoot/miss detection ported verbatim from CHAIN — edit with care.
      const prevD=wrap(this.angle-this.zoneC);
      this.angle=wrap(this.angle+this.dir*this.speed*dt*this.timeScale);
      const d=wrap(this.angle-this.zoneC);
      const inside=Math.abs(d)<=this.zoneHalf;
      if(inside){ this.wasInside=true; }
      else if(this.wasInside){
        if(Math.sign(d)===Math.sign(this.dir)) this.breakRope();
        this.wasInside=false;
      } else {
        if(Math.sign(prevD)!==Math.sign(d)&&Math.abs(prevD)>this.zoneHalf&&Math.abs(d)>this.zoneHalf&&Math.abs(prevD-d)<Math.PI) this.breakRope();
      }
    } else if(this.st==='ready'){
      this.angle=wrap(this.angle+this.dir*0.9*dt);
    }
    this.ghosts.forEach(g2=>g2.life-=0.03); this.ghosts=this.ghosts.filter(g2=>g2.life>0);
    if(this.banner){ this.banner.life-=0.016; if(this.banner.life<=0) this.banner=null; }
  },
  drawPole(){
    const p=this.pal();
    rr(this.CX-6,this.POLE_TOP,12,this.POLE_BOT-this.POLE_TOP+8,5); ctx.fillStyle='#3a2a16'; ctx.fill();
    rr(this.CX-6,this.POLE_TOP,4,this.POLE_BOT-this.POLE_TOP+8,3); ctx.fillStyle='#5a4324'; ctx.fill();
    rr(this.CX-9,this.POLE_TOP-6,18,8,3); ctx.fillStyle=p.acc; ctx.fill();
    // spiral wind meter — coils up the pole as the rope winds (gold near full)
    const topY=this.windHeight();
    ctx.save(); ctx.lineWidth=3; ctx.lineCap='round';
    const col=this.wind>=this.WIND_MAX*0.75?'#ffd24a':p.glow;
    ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur=8;
    ctx.beginPath();
    let first=true;
    for(let t=0;t<=1.0001;t+=0.02){
      const y=this.POLE_BOT-(this.POLE_BOT-topY)*t;
      const a=t*6*Math.PI*2;
      const x=this.CX+Math.cos(a)*9;
      if(first){ ctx.moveTo(x,y); first=false; } else ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.restore();
    ctx.save(); ctx.fillStyle='#ffd24a'; ctx.shadowColor='#ffd24a'; ctx.shadowBlur=10*this.flash+4;
    ctx.beginPath(); ctx.arc(this.CX,topY,4,0,Math.PI*2); ctx.fill(); ctx.restore();
  },
  render(){
    const p=this.pal();
    ctx.save();
    if(this.shake>0.4) ctx.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake*0.7);
    drawBG(p);
    this.drawPole();
    // orbit ring (the timing plane)
    ctx.save(); ctx.strokeStyle=p.ring; ctx.globalAlpha=0.12; ctx.lineWidth=12;
    ctx.beginPath(); ctx.arc(this.CX,this.CY,this.R,0,Math.PI*2); ctx.stroke(); ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(this.CX,this.CY,this.R,0,Math.PI*2); ctx.stroke();
    // hit zone
    if(this.st==='play'){
      const pulse=0.75+0.25*Math.sin(tick*0.18);
      ctx.save(); ctx.lineCap='round';
      ctx.strokeStyle=p.glow; ctx.shadowColor=p.glow; ctx.shadowBlur=18*pulse;
      ctx.lineWidth=12; ctx.globalAlpha=0.92;
      ctx.beginPath(); ctx.arc(this.CX,this.CY,this.R,this.zoneC-this.zoneHalf,this.zoneC+this.zoneHalf); ctx.stroke();
      ctx.lineWidth=5; ctx.globalAlpha=1; ctx.strokeStyle='#fff'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(this.CX,this.CY,this.R,this.zoneC-this.zoneHalf*this.PERFECT_FRAC,this.zoneC+this.zoneHalf*this.PERFECT_FRAC); ctx.stroke();
      ctx.restore();
    }
    // ghosts of past strikes
    this.ghosts.forEach(g2=>{
      ctx.globalAlpha=g2.life*0.5;
      const gp=this.ballPos(g2.a);
      ctx.strokeStyle=g2.c; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(gp.x,gp.y,13,0,Math.PI*2); ctx.stroke();
    });
    ctx.globalAlpha=1;
    // rope from pole cap to ball, trail, then the ball itself
    const pos=this.ballPos(this.angle);
    ctx.strokeStyle='rgba(240,230,200,0.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(this.CX,this.POLE_TOP-2); ctx.lineTo(pos.x,pos.y); ctx.stroke();
    this.trail.push({x:pos.x,y:pos.y}); if(this.trail.length>12) this.trail.shift();
    this.trail.forEach((t2,i)=>{
      const f=i/this.trail.length;
      ctx.globalAlpha=f*0.30; ctx.fillStyle=p.glow;
      ctx.beginPath(); ctx.arc(t2.x,t2.y,(5+f*6)/2,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
    ctx.save(); ctx.translate(pos.x,pos.y);
    ctx.shadowColor=p.glow; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fillStyle='#e85d15'; ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.stroke();
    drawMark(0,0,20,'#f5ece0');
    ctx.restore();
    drawFX();
    if(this.banner){
      const b=this.banner;
      const a2=Math.min(1,b.life*2);
      const scale=1+(1-Math.min(1,b.life*1.6))*0.25;
      ctx.save(); ctx.globalAlpha=a2;
      ctx.translate(this.CX,this.CY-this.R-42); ctx.scale(scale,scale);
      ctx.font='11px "Press Start 2P"'; ctx.textAlign='center';
      ctx.fillStyle='#fff'; ctx.shadowColor='#ffd24a'; ctx.shadowBlur=16;
      ctx.fillText(b.t,0,0);
      ctx.restore();
    }
    // HUD
    ctx.textAlign='center';
    ctx.font='26px "Press Start 2P"'; ctx.fillStyle='#fff';
    ctx.shadowColor=p.glow; ctx.shadowBlur=14;
    ctx.fillText(this.score,W/2,76);
    ctx.shadowBlur=0;
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillText('BEST '+this.best,W/2,96);
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='#ffd24a';
    if(this.loop>0){ ctx.shadowColor='#ffaa00'; ctx.shadowBlur=6; }
    ctx.fillText('LOOP ×'+this.mult(),W/2,116);
    ctx.shadowBlur=0;
    const rk=rankFor(this.ranks,this.score);
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle=p.ring;
    ctx.fillText(rk.t,W/2,H-42);
    const nx=nextRank(this.ranks,this.score);
    if(nx){
      ctx.font='5px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.fillText((nx.s-this.score)+' TO '+nx.t,W/2,H-26);
    }
    ctx.restore();
    if(this.st==='ready') drawReadyScreen(p,'SWINGBALL',['TAP WHEN THE BALL CROSSES THE ZONE','CLEAN HITS WIND THE ROPE UP','FILL THE METER TO BANK A LOOP','A WILD SWING SNAPS THE ROPE']);
    if(this.st==='over') drawOverScreen(p,'ROPE SNAPPED',this.score,this.best,this.newBest,rankFor(this.ranks,this.score).t,'BANKED '+this.loop+' LOOPS');
  },
  tap(){
    if(this.st==='ready'){ this.start(); return; }
    if(this.st==='over'){
      if(performance.now()-this.overAt>450){ this.init(); this.start(); }
      return;
    }
    const d=wrap(this.angle-this.zoneC), ad=Math.abs(d);
    if(ad<=this.zoneHalf) this.clean(d);
    else if(ad<=this.zoneHalf*this.SLOP) this.mistime();
    else this.breakRope();
  }
};

// ════════════════════════════════════════════════════════════════
//  GAME 6: SCRAMBLE  (the lolly scramble, inverted — you throw)
//  Score rewards EVENNESS, not volume: rate × (1 − stddev/maxStddev),
//  with a FAIR SHARE ×2 when everyone is fed and level (CHATTER analogue).
//  Kids' meters decay (greedy kids faster); an empty meter costs a life.
//  NOTE: the spec's spatial "greedy kids drift to dropped lollies" is
//  deferred — directed throws always connect in v1; per-kid decay carries
//  the greedy-kid pressure.
// ════════════════════════════════════════════════════════════════
const SCRAMBLE={
  id:'scramble', name:'SCRAMBLE', tag:'SHARE THE LOLLIES',
  bestKey:'arc_scramble_best',
  par:120, // PROVISIONAL — retune from play data (set after first playable)
  ranks:[{s:0,t:'FIRST TOSS'},{s:40,t:'LOLLY LOBBER'},{s:100,t:'GALA DAY REGULAR'},{s:200,t:'CROWD PLEASER'},{s:350,t:'FAIR SHARE HERO'},{s:550,t:'PARTY LEGEND'},{s:800,t:'SCRAMBLE SAINT'}],
  KID_Y:532, THROW_X:W/2, THROW_Y:172, MAX_KIDS:5,
  DECAY_BASE:5.0, DECAY_GROWTH:1.6, STAGE_INTERVAL:12,
  THROW_GAIN:34, SCORE_RATE:5.0,
  FAIR_FLOOR:60, FAIR_BAND:20,
  CRY_TIME:1.4, PITY:42,
  init(){
    const xs=[44,112,180,248,316];
    const cols=['#ff6a8a','#4aa3ff','#ffd24a','#5fe89a','#c89aff'];
    this.kids=xs.map((x,i)=>({
      x, i, active:(i>=1&&i<=3), haul:(i>=1&&i<=3)?70:0,
      decayMul:0.8+Math.random()*0.6, away:0, bob:Math.random()*Math.PI*2,
      color:cols[i], happy:0,
    }));
    this.lollies=[];
    this.decay=this.DECAY_BASE;
    this.stage=0; this.stageT=0;
    this.lives=3; this.score=0; this.throws=0;
    this.fairShare=false; this.throwArm=0;
    this.timeScale=1; this.shake=0; this.banner=null;
    this.best=loadBest(this.bestKey);
    this.newBest=false; this.st='ready'; this.overAt=0;
    parts=[]; pops=[];
  },
  pal(){ return PALS[4]; }, // party pink
  start(){ this.st='play'; },
  activeKids(){ return this.kids.filter(k=>k.active&&k.away<=0); },
  lollyPos(l){
    const t=l.t;
    return {x:l.x0+(l.tx-l.x0)*t, y:l.y0+(l.ty-l.y0)*t-Math.sin(Math.min(1,t)*Math.PI)*80};
  },
  throwTo(k){
    const cols=['#ff6a8a','#4aa3ff','#ffd24a','#5fe89a','#ff9a3a','#c89aff'];
    this.lollies.push({x0:this.THROW_X,y0:this.THROW_Y,tx:k.x,ty:this.KID_Y-14,t:0,target:k.i,color:cols[(Math.random()*cols.length)|0]});
    this.throws++; this.throwArm=1; sTick(0.03);
  },
  kidEmpty(k){
    k.away=this.CRY_TIME; this.lives--;
    burst(k.x,this.KID_Y,'#ff4455',14,3.5);
    pop('CRYING!',k.x,this.KID_Y-40,'#ff6a8a',6);
    sBad(); buzz(45); this.shake=Math.max(this.shake,5);
    if(this.lives<=0) this.stall();
  },
  stall(){
    this.st='over'; this.overAt=performance.now(); this.fairShare=false;
    sBad(); buzz(70); this.shake=10;
    if(this.onOver) this.onOver();
  },
  stageUp(){
    this.stage++; this.decay+=this.DECAY_GROWTH;
    let woke=false;
    for(const idx of [0,4]){ if(!this.kids[idx].active){ this.kids[idx].active=true; this.kids[idx].haul=60; woke=true; break; } }
    this.kids.forEach(k=>{ if(k.active&&k.away<=0) k.haul=Math.min(100,k.haul+16); });
    this.timeScale=0.4;
    this.banner={t:woke?'NEW KID!':'HUNGRIER!',life:1.4};
    burst(W/2,180,this.pal().glow,20,4.5);
    sStage(); buzz(30); this.shake=5;
  },
  update(dt){
    this.timeScale+=(1-this.timeScale)*0.055;
    this.shake*=0.82;
    if(this.throwArm>0) this.throwArm-=dt*4;
    if(this.st==='play'){
      this.stageT+=dt;
      if(this.stageT>=this.STAGE_INTERVAL){ this.stageT=0; this.stageUp(); }
      this.kids.forEach(k=>{
        if(!k.active) return;
        if(k.away>0){ k.away-=dt*this.timeScale; if(k.away<=0) k.haul=this.PITY; return; }
        k.haul-=this.decay*k.decayMul*dt*this.timeScale;
        if(k.happy>0) k.happy-=dt*2;
        if(k.haul<=0){ k.haul=0; this.kidEmpty(k); }
      });
      this.lollies.forEach(l=>{
        l.t+=dt*2.2*this.timeScale; // ~0.45s flight
        if(l.t>=1){
          const k=this.kids[l.target];
          if(k&&k.active&&k.away<=0){
            k.haul=Math.min(100,k.haul+this.THROW_GAIN); k.happy=1;
            burst(k.x,this.KID_Y-10,l.color,8,2.6); pop('+',k.x,this.KID_Y-34,l.color,7); sHit();
          }
          l.done=true;
        }
      });
      this.lollies=this.lollies.filter(l=>!l.done);
      // scoring — evenness, not volume
      const live=this.activeKids();
      let ev=0, fair=false;
      if(live.length>0){
        const hs=live.map(k=>k.haul);
        const mean=hs.reduce((a,b)=>a+b,0)/hs.length;
        const sd=Math.sqrt(hs.reduce((a,b)=>a+(b-mean)*(b-mean),0)/hs.length);
        ev=Math.max(0,1-sd/50); // maxStddev≈50 for values in [0,100]
        const mn=Math.min.apply(null,hs), mx=Math.max.apply(null,hs);
        fair=live.length>=2 && mn>=this.FAIR_FLOOR && (mx-mn)<=this.FAIR_BAND;
      }
      const wasFair=this.fairShare; this.fairShare=fair;
      if(fair&&!wasFair){ sGold(); buzz(20); }
      let rate=this.SCORE_RATE*ev;
      if(fair) rate*=2;
      this.score+=rate*dt*this.timeScale;
      const si=Math.floor(this.score);
      if(si>this.best){ this.best=si; this.newBest=true; saveBest(this.bestKey,this.best); }
    }
    this.kids.forEach(k=>k.bob+=dt*3);
    if(this.banner){ this.banner.life-=0.016; if(this.banner.life<=0) this.banner=null; }
  },
  drawKid(k){
    const kx=k.x, ky=this.KID_Y, OUT='#140a12';
    if(!k.active){
      ctx.save(); ctx.globalAlpha=0.13; ctx.setLineDash([4,4]);
      ctx.strokeStyle='#fff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(kx,ky-6,15,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]); ctx.restore(); return;
    }
    const away=k.away>0, worried=k.haul<30, bob=Math.sin(k.bob)*2;
    ctx.save(); ctx.translate(kx,ky+bob); ctx.globalAlpha=away?0.45:1;
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0,28,15,4,0,0,Math.PI*2); ctx.fill();
    rr(-8,14,16,14,4); ctx.fillStyle=OUT; ctx.fill();
    rr(-7,15,6,11,3); ctx.fillStyle='#2a2438'; ctx.fill();
    rr(1,15,6,11,3); ctx.fillStyle='#2a2438'; ctx.fill();
    rr(-11,-4,22,22,6); ctx.fillStyle=OUT; ctx.fill();
    rr(-10,-3,20,20,5); ctx.fillStyle=k.color; ctx.fill();
    rr(-10,-3,20,7,5); ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fill();
    rr(-12,-28,24,24,8); ctx.fillStyle=OUT; ctx.fill();
    rr(-11,-27,22,22,7); ctx.fillStyle='#f4c78a'; ctx.fill();
    rr(-11,-27,22,8,7); ctx.fillStyle='#3a2410'; ctx.fill();
    if(away){
      ctx.fillStyle='#111'; ctx.fillRect(-6,-17,4,2); ctx.fillRect(2,-17,4,2);
      ctx.fillStyle='#5fd0ff'; ctx.fillRect(-5,-13,2,6); ctx.fillRect(3,-13,2,6);
      ctx.fillStyle='#7a1020'; ctx.fillRect(-3,-8,6,3);
    } else {
      ctx.fillStyle='#fff'; ctx.fillRect(-6,-18,5,5); ctx.fillRect(2,-18,5,5);
      ctx.fillStyle='#111'; ctx.fillRect(worried?-6:-4,-17,3,3); ctx.fillRect(worried?4:3,-17,3,3);
      ctx.strokeStyle='#7a1020'; ctx.lineWidth=1.5; ctx.beginPath();
      if(k.haul>=60) ctx.arc(0,-11,4,0.15*Math.PI,0.85*Math.PI);
      else if(worried) ctx.arc(0,-6,4,1.15*Math.PI,1.85*Math.PI);
      else { ctx.moveTo(-3,-9); ctx.lineTo(3,-9); }
      ctx.stroke();
      if(k.happy>0){ ctx.save(); ctx.globalAlpha=k.happy; ctx.fillStyle='#fff'; ctx.fillRect(9,-25,2,2); ctx.fillRect(-11,-23,2,2); ctx.restore(); }
    }
    ctx.restore();
    // haul meter — floats above the head so the ground stays clear
    const bw=40, bx=kx-bw/2, by=ky-46;
    rr(bx-1,by-1,bw+2,7,3); ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fill();
    const f=Math.max(0,Math.min(1,k.haul/100));
    ctx.fillStyle=k.haul>=60?'#5fe89a':(k.haul>=30?'#ffd24a':'#ff5a4a');
    rr(bx,by,Math.max(0,bw*f),5,2); ctx.fill();
    if(this.fairShare){ ctx.save(); ctx.globalAlpha=0.5+0.4*Math.sin(tick*0.2); ctx.strokeStyle='#ffd24a'; ctx.lineWidth=1.5; rr(bx-1,by-1,bw+2,7,3); ctx.stroke(); ctx.restore(); }
  },
  drawThrower(){
    const OUT='#140a12', p=this.pal();
    ctx.save(); ctx.translate(W/2,184);
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0,34,22,5,0,0,Math.PI*2); ctx.fill();
    rr(-11,16,22,18,5); ctx.fillStyle=OUT; ctx.fill();
    rr(-10,17,9,15,3); ctx.fillStyle='#243048'; ctx.fill();
    rr(1,17,9,15,3); ctx.fillStyle='#243048'; ctx.fill();
    rr(-15,-8,30,28,7); ctx.fillStyle=OUT; ctx.fill();
    rr(-14,-7,28,26,6); ctx.fillStyle=p.acc; ctx.fill();
    rr(-14,-7,28,9,6); ctx.fillStyle=p.ring; ctx.fill();
    rr(-13,-34,26,26,8); ctx.fillStyle=OUT; ctx.fill();
    rr(-12,-33,24,24,7); ctx.fillStyle='#f4c78a'; ctx.fill();
    rr(-12,-33,24,8,7); ctx.fillStyle='#2a1808'; ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillRect(-6,-22,5,5); ctx.fillRect(2,-22,5,5);
    ctx.fillStyle='#111'; ctx.fillRect(-4,-21,3,3); ctx.fillRect(4,-21,3,3);
    ctx.strokeStyle='#7a1020'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,-14,4,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    // throwing arm (raises on throw) holding a lolly
    const raise=Math.max(0,this.throwArm)*-10;
    rr(-25,-2+raise,11,8,3); ctx.fillStyle=OUT; ctx.fill();
    rr(-24,-1+raise,9,6,2); ctx.fillStyle='#c89aff'; ctx.fill();
    // bag of lollies on the other hip
    rr(15,2,13,16,4); ctx.fillStyle=OUT; ctx.fill();
    rr(16,3,11,14,3); ctx.fillStyle='#ff6a8a'; ctx.fill();
    ctx.fillStyle='#ffd24a'; ctx.fillRect(18,6,2,2); ctx.fillStyle='#5fe89a'; ctx.fillRect(22,10,2,2); ctx.fillStyle='#4aa3ff'; ctx.fillRect(19,13,2,2);
    ctx.restore();
  },
  render(){
    const p=this.pal();
    ctx.save();
    if(this.shake>0.4) ctx.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake*0.7);
    drawBG(p);
    ctx.fillStyle='#160a10'; ctx.fillRect(0,560,W,80);
    ctx.fillStyle=p.acc+'55'; ctx.fillRect(0,560,W,2);
    this.drawThrower();
    this.kids.forEach(k=>this.drawKid(k));
    this.lollies.forEach(l=>{
      const pos=this.lollyPos(l);
      ctx.save(); ctx.translate(pos.x,pos.y); ctx.rotate(l.t*8);
      ctx.shadowColor=l.color; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fillStyle=l.color; ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle=l.color;
      ctx.beginPath(); ctx.moveTo(-5,0); ctx.lineTo(-9,-3); ctx.lineTo(-9,3); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(5,0); ctx.lineTo(9,-3); ctx.lineTo(9,3); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillRect(-2,-2,2,2);
      ctx.restore();
    });
    drawFX();
    if(this.fairShare&&this.st==='play'){
      ctx.save(); ctx.globalAlpha=(0.5+0.4*Math.sin(tick*0.2))*0.10; ctx.fillStyle='#ffd24a'; ctx.fillRect(0,0,W,H); ctx.restore();
    }
    if(this.banner){
      const b=this.banner, a2=Math.min(1,b.life*2), scale=1+(1-Math.min(1,b.life*1.6))*0.25;
      ctx.save(); ctx.globalAlpha=a2; ctx.translate(W/2,150); ctx.scale(scale,scale);
      ctx.font='11px "Press Start 2P"'; ctx.textAlign='center';
      ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=16; ctx.fillText(b.t,0,0);
      ctx.restore();
    }
    // HUD
    ctx.textAlign='center';
    ctx.font='26px "Press Start 2P"'; ctx.fillStyle='#fff';
    ctx.shadowColor=p.glow; ctx.shadowBlur=14; ctx.fillText(Math.floor(this.score),W/2,76); ctx.shadowBlur=0;
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fillText('BEST '+this.best,W/2,96);
    for(let i=0;i<3;i++){ const lx=W/2-26+i*26; ctx.save(); ctx.globalAlpha=i<this.lives?1:0.18;
      ctx.fillStyle='#ff6a8a'; ctx.beginPath(); ctx.arc(lx,110,5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(lx-5,110); ctx.lineTo(lx-9,107); ctx.lineTo(lx-9,113); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(lx+5,110); ctx.lineTo(lx+9,107); ctx.lineTo(lx+9,113); ctx.closePath(); ctx.fill();
      ctx.restore(); }
    if(this.fairShare&&this.st==='play'){
      ctx.save(); ctx.globalAlpha=0.6+0.4*Math.sin(tick*0.2);
      ctx.font='6px "Press Start 2P"'; ctx.fillStyle='#ffd24a'; ctx.shadowColor='#ffaa00'; ctx.shadowBlur=8;
      ctx.fillText('FAIR SHARE! ×2',W/2,130); ctx.restore();
    }
    const rk=rankFor(this.ranks,Math.floor(this.score));
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle=p.ring; ctx.fillText(rk.t,W/2,H-42);
    const nx=nextRank(this.ranks,Math.floor(this.score));
    if(nx){ ctx.font='5px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillText((nx.s-Math.floor(this.score))+' TO '+nx.t,W/2,H-26); }
    ctx.restore();
    if(this.st==='ready') drawReadyScreen(p,'SCRAMBLE',['TAP A KID TO THROW THEM A LOLLY','KEEP EVERYONE FED — AND EQUAL','MATCHING METERS = FAIR SHARE ×2','A METER HITTING EMPTY COSTS A LIFE']);
    if(this.st==='over') drawOverScreen(p,"PARTY'S OVER",Math.floor(this.score),this.best,this.newBest,rankFor(this.ranks,Math.floor(this.score)).t,'STAGE '+(this.stage+1)+' · '+this.throws+' THROWS');
  },
  tap(x,y){
    if(this.st==='ready'){ this.start(); return; }
    if(this.st==='over'){
      if(performance.now()-this.overAt>450){ this.init(); this.start(); }
      return;
    }
    let best=null, bestD=1e9;
    this.activeKids().forEach(k=>{
      const d=Math.hypot(x-k.x,y-this.KID_Y);
      if(d<48&&d<bestD){ best=k; bestD=d; }
    });
    if(best) this.throwTo(best); // tapping empty space is a harmless no-op
  }
};

// ════════════════════════════════════════════════════════════════
//  GAME 7: KNUCKLEBONES  (digitised jacks — catch the toss)
//  Gold bones = CATCH (tap airborne); grey bones = SKIP (leave them).
//  A missed catch OR a wrong tap = a drop; 3 drops = over. The traditional
//  sequence is the level ladder; it loops endlessly, faster, after the top.
//  Simple parabolic physics, no rotation sim — a horizontal frame-flip
//  sells the spin (rule 4). Asphalt court is drawn; PALS[5] gives accents.
// ════════════════════════════════════════════════════════════════
const KNUCKLEBONES={
  id:'bones', name:'KNUCKLEBONES', tag:'CATCH THE BONES',
  bestKey:'arc_bones_best',
  par:90, // PROVISIONAL — retune from play data (set after first playable)
  LADDER:['ONESIES','TWOSIES','THREESIES','FOURSIES','CLICKS','HORSES IN THE STABLE','OVER THE FENCE'],
  RUNGS:[{c:1,s:0,spd:1.00},{c:2,s:0,spd:1.05},{c:3,s:0,spd:1.10},{c:4,s:0,spd:1.18},{c:5,s:0,spd:1.28},{c:4,s:1,spd:1.34},{c:3,s:2,spd:1.45}],
  ranks:[{s:0,t:'ONESIES'},{s:14,t:'TWOSIES'},{s:34,t:'THREESIES'},{s:58,t:'FOURSIES'},{s:86,t:'CLICKS'},{s:120,t:'HORSES IN THE STABLE'},{s:150,t:'OVER THE FENCE'}],
  CATCH_LINE:480, SLOTS:[44,110,176,242,308],
  BASE_LV:660, BASE_G:1000, TOSS_GAP:0.5, CLEARS_PER_RUNG:2, CATCH_R:34,
  init(){
    this.bones=[];
    this.drops=0; this.score=0; this.catches=0;
    this.rung=0; this.loop=0; this.tossClears=0;
    this.baseSpd=1.0;
    this.gapT=this.TOSS_GAP; this.tossActive=false; this.tossFault=false;
    this.timeScale=1; this.shake=0; this.banner=null;
    this.best=loadBest(this.bestKey);
    this.newBest=false; this.st='ready'; this.overAt=0;
    parts=[]; pops=[];
  },
  pal(){ return PALS[5]; }, // amber accents; the schoolyard court is drawn grey below
  mult(){ return 1+this.loop; },
  start(){ this.st='play'; this.gapT=0.5; },
  rungCfg(){ return this.RUNGS[this.rung]; },
  launchToss(){
    const cfg=this.rungCfg(), total=cfg.c+cfg.s;
    const spd=this.baseSpd*cfg.spd, lv=this.BASE_LV*spd, g=this.BASE_G*spd*spd;
    const slots=this.SLOTS.slice();
    for(let i=slots.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=slots[i]; slots[i]=slots[j]; slots[j]=t; }
    const roles=[];
    for(let i=0;i<cfg.c;i++) roles.push('catch');
    for(let i=0;i<cfg.s;i++) roles.push('skip');
    for(let i=roles.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=roles[i]; roles[i]=roles[j]; roles[j]=t; }
    this.bones=[];
    for(let i=0;i<total;i++){
      this.bones.push({x:slots[i], y:this.CATCH_LINE, vy:-lv, vx:(Math.random()-0.5)*16, g,
        kind:roles[i], caught:false, landed:false, delay:i*0.08, flip:false, seed:(Math.random()*6)|0});
    }
    this.tossActive=true; this.tossFault=false;
    beep(700,0.05,'square',0.03);
  },
  drop(b,label){
    this.tossFault=true; this.drops++;
    burst(b.x,this.CATCH_LINE,'#ff4455',14,3.5);
    pop(label,b.x,this.CATCH_LINE-24,'#ff6a8a',6);
    sBad(); buzz(45); this.shake=Math.max(this.shake,5);
    if(this.drops>=3) this.over();
  },
  onLand(b){
    if(b.kind==='catch'&&!b.caught) this.drop(b,'DROP!');
    else if(b.kind==='skip') sTick(0.02); // leaving a grey bone is correct
  },
  resolveToss(){
    this.tossActive=false;
    if(!this.tossFault){
      this.score+=5*this.mult();
      pop('+'+(5*this.mult()),W/2,300,'#ffd24a',6);
      this.tossClears++;
      if(this.tossClears>=this.CLEARS_PER_RUNG) this.rungUp();
    }
    const si=Math.floor(this.score);
    if(si>this.best){ this.best=si; this.newBest=true; saveBest(this.bestKey,this.best); }
    this.gapT=this.TOSS_GAP;
  },
  rungUp(){
    this.tossClears=0;
    if(this.rung>=this.LADDER.length-1){
      this.loop++; this.rung=0; this.baseSpd*=1.12;
      this.banner={t:'LOOP ×'+this.mult()+'!',life:1.6}; sGold();
    } else {
      this.rung++;
      this.banner={t:this.LADDER[this.rung]+'!',life:1.5}; sStage();
    }
    this.timeScale=0.4; buzz(30); this.shake=5;
    burst(W/2,300,this.pal().glow,20,4.5);
  },
  over(){
    this.st='over'; this.overAt=performance.now(); this.tossActive=false;
    sBad(); buzz(70); this.shake=10;
    if(this.onOver) this.onOver();
  },
  update(dt){
    this.timeScale+=(1-this.timeScale)*0.055;
    this.shake*=0.82;
    if(this.st==='play'){
      const ts=this.timeScale;
      if(this.gapT>0){ this.gapT-=dt*ts; if(this.gapT<=0&&!this.tossActive) this.launchToss(); }
      this.bones.forEach(b=>{
        if(b.caught||b.landed) return;
        if(b.delay>0){ b.delay-=dt*ts; return; }
        b.vy+=b.g*dt*ts; b.y+=b.vy*dt*ts; b.x+=b.vx*dt*ts;
        if((tick+b.seed)%6===0) b.flip=!b.flip; // spin frame-flip
        if(b.vy>0&&b.y>=this.CATCH_LINE){ b.y=this.CATCH_LINE; b.landed=true; this.onLand(b); }
      });
      if(this.tossActive&&this.bones.length>0&&this.bones.every(b=>b.caught||b.landed)) this.resolveToss();
    }
    if(this.banner){ this.banner.life-=0.016; if(this.banner.life<=0) this.banner=null; }
  },
  drawCourt(){
    const y=this.CATCH_LINE;
    const g=ctx.createLinearGradient(0,y,0,H);
    g.addColorStop(0,'#3a3a40'); g.addColorStop(1,'#242428');
    ctx.fillStyle=g; ctx.fillRect(0,y,W,H-y);
    ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(0,y,W,2);
    ctx.fillStyle='rgba(255,255,255,0.05)';
    for(let i=0;i<40;i++){ const rx=(i*97)%W, ry=y+8+((i*53)%(H-y-10)); ctx.fillRect(rx,ry,2,2); }
    ctx.save(); ctx.setLineDash([8,7]); ctx.strokeStyle='rgba(240,236,224,0.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.restore();
    ctx.strokeStyle='rgba(240,236,224,0.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(W/2,H-58,64,20,0,0,Math.PI*2); ctx.stroke();
  },
  drawShadow(b){
    const h=Math.max(0,this.CATCH_LINE-b.y), s=Math.max(0.3,1-h/300);
    ctx.save(); ctx.globalAlpha=0.25*s; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(b.x,this.CATCH_LINE+8,11*s,4*s,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  },
  drawBone(b){
    const catchB=b.kind==='catch';
    ctx.save(); ctx.translate(b.x,b.y); ctx.scale(b.flip?-1:1,1);
    const col=catchB?'#f0e6d0':'#8f887c';
    if(catchB){ ctx.shadowColor='#ffd24a'; ctx.shadowBlur=10; }
    ctx.fillStyle='#140f0a'; rr(-9,-5,18,10,4); ctx.fill();
    [[-8,-4],[-8,4],[8,-4],[8,4]].forEach(k=>{ ctx.beginPath(); ctx.arc(k[0],k[1],3.4,0,Math.PI*2); ctx.fill(); });
    ctx.shadowBlur=0;
    ctx.fillStyle=col; rr(-7,-4,14,8,3); ctx.fill();
    [[-8,-4],[-8,4],[8,-4],[8,4]].forEach(k=>{ ctx.beginPath(); ctx.arc(k[0],k[1],2.6,0,Math.PI*2); ctx.fill(); });
    ctx.fillStyle='rgba(255,255,255,0.28)'; rr(-6,-3,12,2.5,2); ctx.fill();
    ctx.fillStyle=catchB?'#ffb020':'#5a564e'; ctx.fillRect(-1.5,-1.5,3,3);
    ctx.restore();
  },
  drawRestingBones(){
    const cy=H-58;
    [[-40,2,0],[-14,-6,1],[12,4,2],[38,-2,3],[0,10,4]].forEach(o=>{
      this.drawBone({x:W/2+o[0],y:cy+o[1],kind:o[2]<3?'catch':'skip',flip:(o[2]%2===0)});
    });
  },
  render(){
    const p=this.pal();
    ctx.save();
    if(this.shake>0.4) ctx.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake*0.7);
    drawBG(p);
    this.drawCourt();
    if(this.st==='ready') this.drawRestingBones();
    else {
      this.bones.forEach(b=>{ if(!b.caught) this.drawShadow(b); });
      this.bones.forEach(b=>{ if(!b.caught) this.drawBone(b); });
    }
    drawFX();
    // HUD
    ctx.textAlign='center';
    ctx.font='26px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=14; ctx.fillText(Math.floor(this.score),W/2,76); ctx.shadowBlur=0;
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fillText('BEST '+this.best,W/2,96);
    for(let i=0;i<3;i++){ const lx=W/2-26+i*26; ctx.save(); ctx.globalAlpha=i<(3-this.drops)?1:0.18;
      ctx.translate(lx,110); ctx.fillStyle='#f0e6d0'; rr(-7,-3,14,6,3); ctx.fill();
      [[-6,-3],[-6,3],[6,-3],[6,3]].forEach(k=>{ ctx.beginPath(); ctx.arc(k[0],k[1],2.4,0,Math.PI*2); ctx.fill(); });
      ctx.restore(); }
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='#ffd24a'; ctx.shadowColor='#ffaa00'; ctx.shadowBlur=6;
    ctx.fillText(this.LADDER[this.rung]+(this.loop>0?' ×'+this.mult():''),W/2,128); ctx.shadowBlur=0;
    ctx.font='5px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.fillText('CLEARS '+this.tossClears+'/'+this.CLEARS_PER_RUNG,W/2,140);
    if(this.banner){
      const b=this.banner, a2=Math.min(1,b.life*2), scale=1+(1-Math.min(1,b.life*1.6))*0.25;
      ctx.save(); ctx.globalAlpha=a2; ctx.translate(W/2,168); ctx.scale(scale,scale);
      ctx.font='11px "Press Start 2P"'; ctx.textAlign='center';
      ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=16; ctx.fillText(b.t,0,0);
      ctx.restore();
    }
    ctx.restore();
    if(this.st==='ready') drawReadyScreen(p,'KNUCKLEBONES',['TAP THE GOLD BONES IN THE AIR','CATCH THEM BEFORE THEY LAND','GREY BONES: LEAVE THEM BE',"3 DROPS AND YOU'RE OUT"]);
    if(this.st==='over') drawOverScreen(p,'BONES DROPPED',Math.floor(this.score),this.best,this.newBest,this.LADDER[this.rung]+(this.loop>0?' ×'+this.mult():''),'LOOP '+(this.loop+1)+' · '+this.catches+' CAUGHT');
  },
  tap(x,y){
    if(this.st==='ready'){ this.start(); return; }
    if(this.st==='over'){
      if(performance.now()-this.overAt>450){ this.init(); this.start(); }
      return;
    }
    let best=null, bd=1e9;
    this.bones.forEach(b=>{
      if(b.caught||b.landed||b.delay>0) return;
      const d=Math.hypot(x-b.x,y-b.y);
      if(d<this.CATCH_R&&d<bd){ best=b; bd=d; }
    });
    if(!best) return; // an empty grab is a harmless no-op
    if(best.kind==='catch'){
      best.caught=true; this.catches++; this.score+=2*this.mult();
      const si=Math.floor(this.score); if(si>this.best){ this.best=si; this.newBest=true; saveBest(this.bestKey,this.best); }
      burst(best.x,best.y,'#ffd24a',8,2.6); pop('CLICK',best.x,best.y-18,'#ffd24a',6); sHit(); buzz(10);
    } else {
      best.landed=true; this.drop(best,'FAULT!'); // tapping a grey bone is a fault
    }
  }
};

// ════════════════════════════════════════════════════════════════
//  MENU + ROUTER
// ════════════════════════════════════════════════════════════════
const GAMES=[STACK,SCAN,CHAIN,SWINGBALL,CHATTER,SCRAMBLE,KNUCKLEBONES]; // gauntlet order (roadmap §3)
let mode='menu', cur=null, paused=false, menuPage=0;
let tick=0, lastT=0;
GAMES.forEach(g=>g.init());

// ════════════════════════════════════════════════════════════════
//  GAUNTLET  (Phase 3 — every game, one score)
//  Sequences all games to first game-over via each game's onOver hook,
//  normalises each score against game.par (÷par ×250, cap 625), and
//  renders interstitials + an end card. Lives outside the game contract;
//  reads only public fields and never mutates game internals.
// ════════════════════════════════════════════════════════════════
const GAUNTLET={
  id:'gauntlet', name:'GAUNTLET', tag:'EVERY GAME · ONE SCORE',
  bestKey:'arc_gauntlet_best', isGauntlet:true,
  CAP:625, NORM:250,
  PALMAP:{stack:0,scan:1,chain:2,swing:3,chatter:3,scramble:4,bones:5},
  gamePal(g){ const i=this.PALMAP[g.id]; return PALS[i!=null?i:2]; },
  contribOf(score,par){ return Math.min(this.CAP,Math.round(score/(par||1)*this.NORM)); },
  begin(){
    this.order=GAMES; this.idx=0; this.total=0; this.results=[];
    this.best=loadBest(this.bestKey); this.newBest=false;
    mode='gauntlet'; paused=false;
    this.launch();
  },
  launch(){
    cur=this.order[this.idx];
    cur.init();
    cur.onOver=()=>this.capture();   // game runs its own ready→play→over
    this.state='playing';
  },
  capture(){
    const g=cur, score=Math.floor(g.score||0);
    this.results.push({name:g.name, score, contrib:this.contribOf(score,g.par), rank:rankFor(g.ranks,score).t, pal:this.gamePal(g)});
    this.total+=this.results[this.results.length-1].contrib;
    g.onOver=null;                    // one-shot — guards double-fire
    this.overAt=performance.now();
    if(this.idx>=this.order.length-1) this.finish();
    else { this.state='interstitial'; sStage(); }
  },
  advance(){ this.idx++; this.launch(); },
  finish(){
    this.state='end'; this.overAt=performance.now();
    if(this.total>this.best){ this.best=this.total; this.newBest=true; saveBest(this.bestKey,this.total); refreshMenuBests(); }
    sGold();
  },
  exit(){
    if(cur) cur.onOver=null;
    cur=null; mode='menu'; paused=false; refreshMenuBests();
  },
  update(dt){ if(this.state==='playing'&&cur) cur.update(dt); },
  render(){
    if(this.state==='playing'&&cur){ cur.render(); this.drawStrip(); }
    else if(this.state==='interstitial') this.drawInterstitial();
    else if(this.state==='end') this.drawEnd();
  },
  tap(x,y){
    if(this.state==='playing'&&cur){ cur.tap(x,y); return; }
    if(performance.now()-this.overAt<=450) return; // debounce
    if(this.state==='interstitial') this.advance();
    else if(this.state==='end') this.exit();
  },
  drawStrip(){
    ctx.save(); ctx.textAlign='center';
    ctx.font='6px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.fillText('GAUNTLET '+(this.idx+1)+'/'+this.order.length+'  ·  '+this.total,W/2,30);
    ctx.restore();
  },
  drawBars(results,y0,rowH,withRank){
    const bx=44, bw=W-88;
    results.forEach((r,i)=>{
      const y=y0+i*rowH;
      ctx.textAlign='left'; ctx.font='6px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.fillText(r.name,bx,y-4);
      ctx.textAlign='right'; ctx.fillStyle=r.pal.ring; ctx.fillText(''+r.contrib,bx+bw,y-4);
      rr(bx,y,bw,7,3); ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fill();
      rr(bx,y,bw*Math.max(0.02,Math.min(1,r.contrib/this.CAP)),7,3); ctx.fillStyle=r.pal.ring; ctx.fill();
      if(withRank){ ctx.textAlign='left'; ctx.font='5px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fillText(r.rank,bx,y+16); }
    });
  },
  drawInterstitial(){
    const p=PALS[2]; drawBG(p); drawFX();
    const r=this.results[this.results.length-1];
    ctx.textAlign='center';
    ctx.font='8px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillText('GAUNTLET',W/2,58);
    ctx.font='14px "Press Start 2P"'; ctx.fillStyle=r.pal.ring; ctx.shadowColor=r.pal.glow; ctx.shadowBlur=12;
    ctx.fillText(r.name,W/2,94); ctx.shadowBlur=0;
    ctx.font='7px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillText('SCORE '+r.score+'   →   +'+r.contrib,W/2,116);
    ctx.font='8px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillText('RUNNING TOTAL',W/2,148);
    ctx.font='30px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=16; ctx.fillText(this.total,W/2,188); ctx.shadowBlur=0;
    this.drawBars(this.results,232,30,false);
    ctx.textAlign='center';
    ctx.font='6px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fillText('NEXT  ·  '+this.order[this.idx+1].name,W/2,H-70);
    ctx.globalAlpha=0.55+0.45*Math.sin(tick*0.09);
    ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.fillText('► TAP TO CONTINUE',W/2,H-44);
    ctx.globalAlpha=1;
  },
  drawEnd(){
    const p=PALS[2]; drawBG(p); drawFX();
    ctx.textAlign='center';
    ctx.font='12px "Press Start 2P"'; ctx.fillStyle='#ffd24a'; ctx.shadowColor='#ffaa00'; ctx.shadowBlur=14; ctx.fillText('GAUNTLET COMPLETE',W/2,56); ctx.shadowBlur=0;
    ctx.font='34px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.shadowColor=p.glow; ctx.shadowBlur=18; ctx.fillText(this.total,W/2,102); ctx.shadowBlur=0;
    if(this.newBest){
      ctx.globalAlpha=0.6+0.4*Math.sin(tick*0.14);
      ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#ffd24a'; ctx.shadowColor='#ffd24a'; ctx.shadowBlur=12; ctx.fillText('★ NEW BEST! ★',W/2,126); ctx.shadowBlur=0; ctx.globalAlpha=1;
    } else {
      ctx.font='7px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fillText('BEST '+this.best,W/2,126);
    }
    this.drawBars(this.results,166,34,true);
    ctx.textAlign='center'; ctx.globalAlpha=0.55+0.45*Math.sin(tick*0.09);
    ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.fillText('► TAP FOR MENU',W/2,H-38);
    ctx.globalAlpha=1;
  },
};
// Menu shows the GAUNTLET card first, then the seven games.
const MENU_ITEMS=[GAUNTLET,...GAMES];

// Menu bests are cached on menu entry, not re-read from localStorage per card per frame.
let menuBests={};
function refreshMenuBests(){
  MENU_ITEMS.forEach(g=>{
    menuBests[g.id]=loadBest(g.bestKey, g.id==='stack'?'cps2_best':(g.id==='chain'?'chain_best':null));
  });
}
refreshMenuBests();

// Paginated 2×2 card list — identical card language, scales past four games.
const PER_PAGE=4;
function menuPageCount(){ return Math.ceil(MENU_ITEMS.length/PER_PAGE); }
function menuCards(){
  const cw=158, chh=164, gx=15, gy=176, gapX=14, gapY=16;
  const start=menuPage*PER_PAGE;
  const cards=[];
  for(let i=start;i<Math.min(start+PER_PAGE,MENU_ITEMS.length);i++){
    const j=i-start;
    cards.push({g:MENU_ITEMS[i], x:gx+(j%2)*(cw+gapX), y:gy+Math.floor(j/2)*(chh+gapY), w:cw, h:chh});
  }
  return cards;
}
function menuNav(){
  const n=menuPageCount(), y=H-52, spread=16;
  const x0=W/2-(n-1)*spread/2;
  const dots=[];
  for(let i=0;i<n;i++) dots.push({x:x0+i*spread,y,r:10,page:i});
  return {
    dots, y,
    left: menuPage>0 ? {x:22,y:y-13,w:26,h:26} : null,
    right: menuPage<n-1 ? {x:W-48,y:y-13,w:26,h:26} : null,
  };
}
function drawArrow(r,dir){ // drawn triangle (rule 4 — no glyphs)
  const cx=r.x+r.w/2, cy=r.y+r.h/2;
  ctx.save(); ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath();
  if(dir<0){ ctx.moveTo(cx+5,cy-7); ctx.lineTo(cx-5,cy); ctx.lineTo(cx+5,cy+7); }
  else { ctx.moveTo(cx-5,cy-7); ctx.lineTo(cx+5,cy); ctx.lineTo(cx-5,cy+7); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawMenuIcon(g,cx,cy){
  const p={stack:PALS[0],scan:PALS[1],chain:PALS[2],swing:PALS[3],chatter:PALS[3],scramble:PALS[4],bones:PALS[5],gauntlet:PALS[5]}[g.id]||PALS[0];
  ctx.save(); ctx.translate(cx,cy);
  if(g.id==='gauntlet'){
    // seven palette chips (every game) beneath one gold mark (one score)
    const rings=[PALS[0].ring,PALS[1].ring,PALS[2].ring,PALS[3].ring,PALS[4].ring,PALS[5].ring,'#ff9a3a'];
    rings.forEach((col,i)=>{
      const rowN=i<4?4:3, colN=i<4?i:i-4, row=i<4?0:1;
      const cx2=(colN-(rowN-1)/2)*13, cy2=8+row*13;
      rr(cx2-5,cy2-5,10,10,3); ctx.fillStyle=col; ctx.fill();
    });
    drawMark(0,-16,20,'#ffd24a');
  } else if(g.id==='stack'){
    [[-20,8,40],[-15,-6,30],[-11,-20,22]].forEach(b=>{
      rr(b[0]-1,b[1]-1,b[2]+2,13,5); ctx.fillStyle='#140a08'; ctx.fill();
      rr(b[0],b[1],b[2],11,4); ctx.fillStyle=PALS[0].acc; ctx.fill();
    });
    drawMark(0,13,16,'#f5ece0');
  } else if(g.id==='scan'){
    rr(-14,-18,28,28,6); ctx.fillStyle='#140a08'; ctx.fill();
    rr(-12,-16,24,24,5); ctx.fillStyle='#e85d15'; ctx.fill();
    drawMark(0,-4,17,'#f5ece0');
    ctx.strokeStyle=PALS[1].glow; ctx.shadowColor=PALS[1].glow; ctx.shadowBlur=8;
    ctx.lineWidth=2.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-16,20); ctx.lineTo(-2,2); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-2,2,3,0,Math.PI*2); ctx.fill();
  } else if(g.id==='chain'){
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=PALS[2].glow; ctx.shadowColor=PALS[2].glow; ctx.shadowBlur=8;
    ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,0,20,-0.6,0.6); ctx.stroke();
    ctx.shadowBlur=0;
    rr(-27,-8,16,16,5); ctx.fillStyle='#e85d15'; ctx.fill();
    drawMark(-19,0,11,'#f5ece0');
  } else if(g.id==='swing'){
    // pole + rope + orbiting ball carrying the mark
    rr(-3,-22,6,44,3); ctx.fillStyle='#5a4324'; ctx.fill();
    rr(-9,-26,18,6,2); ctx.fillStyle=PALS[3].acc; ctx.fill();
    ctx.strokeStyle=PALS[3].glow; ctx.shadowColor=PALS[3].glow; ctx.shadowBlur=8;
    ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(16,6); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(16,6,7,0,Math.PI*2); ctx.fillStyle='#e85d15'; ctx.fill();
    drawMark(16,6,9,'#f5ece0');
  } else if(g.id==='scramble'){
    // lollies raining onto a smiling kid
    [['#ff6a8a',-14,-16],['#4aa3ff',5,-19],['#ffd24a',16,-8]].forEach(cd=>{
      ctx.save(); ctx.translate(cd[1],cd[2]);
      ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fillStyle=cd[0]; ctx.fill();
      ctx.fillStyle=cd[0];
      ctx.beginPath(); ctx.moveTo(-5,0); ctx.lineTo(-8,-2); ctx.lineTo(-8,2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(5,0); ctx.lineTo(8,-2); ctx.lineTo(8,2); ctx.closePath(); ctx.fill();
      ctx.restore();
    });
    rr(-11,4,22,20,7); ctx.fillStyle='#140a12'; ctx.fill();
    rr(-10,5,20,18,6); ctx.fillStyle='#f4c78a'; ctx.fill();
    rr(-10,5,20,6,6); ctx.fillStyle='#3a2410'; ctx.fill();
    ctx.fillStyle='#111'; ctx.fillRect(-5,12,3,3); ctx.fillRect(3,12,3,3);
    ctx.strokeStyle='#7a1020'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,16,3,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  } else if(g.id==='bones'){
    // a little pile of knucklebones, one gold one tossed above
    [[-12,9,0.3,'#f0e6d0'],[11,11,-0.4,'#f0e6d0'],[-1,0,0.12,'#f0e6d0'],[1,-17,0,'#ffd24a']].forEach(bn=>{
      ctx.save(); ctx.translate(bn[0],bn[1]); ctx.rotate(bn[2]);
      if(bn[3]==='#ffd24a'){ ctx.shadowColor='#ffd24a'; ctx.shadowBlur=8; }
      ctx.fillStyle='#140f0a'; rr(-9,-5,18,10,4); ctx.fill();
      [[-8,-4],[-8,4],[8,-4],[8,4]].forEach(k=>{ ctx.beginPath(); ctx.arc(k[0],k[1],3.2,0,Math.PI*2); ctx.fill(); });
      ctx.shadowBlur=0; ctx.fillStyle=bn[3]; rr(-7,-4,14,8,3); ctx.fill();
      [[-8,-4],[-8,4],[8,-4],[8,4]].forEach(k=>{ ctx.beginPath(); ctx.arc(k[0],k[1],2.4,0,Math.PI*2); ctx.fill(); });
      ctx.restore();
    });
  } else {
    ctx.strokeStyle='#8a94a8'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(0,-2,20,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#d8e2f0'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,-2,19,0,Math.PI*2); ctx.stroke();
    for(let i=0;i<3;i++){
      const a=Math.PI/2+(i-1)*0.5;
      ctx.save(); ctx.translate(Math.cos(a)*20,-2+Math.sin(a)*20);
      ctx.strokeStyle='#c8b060'; ctx.lineWidth=3.5;
      ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
}
function drawMenu(){
  drawBG(PALS[2]);
  ctx.textAlign='center';
  // brand chip
  ctx.save(); ctx.translate(W/2,74);
  ctx.shadowColor=PALS[2].glow; ctx.shadowBlur=22;
  rr(-30,-30,60,60,14); ctx.fillStyle='#e85d15'; ctx.fill();
  ctx.shadowBlur=0;
  drawMark(0,1,44,'#f5ece0');
  ctx.restore();
  ctx.font='16px "Press Start 2P"'; ctx.fillStyle='#fff';
  ctx.shadowColor=PALS[2].glow; ctx.shadowBlur=16;
  ctx.fillText('CENTRARCADE',W/2,138);
  ctx.shadowBlur=0;
  ctx.font='6px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText('SEVEN QUICK GAMES \u00b7 ONE THUMB',W/2,158);
  menuCards().forEach(card=>{
    const g=card.g;
    const p={stack:PALS[0],scan:PALS[1],chain:PALS[2],swing:PALS[3],chatter:PALS[3],scramble:PALS[4],bones:PALS[5],gauntlet:PALS[5]}[g.id];
    const pulse=0.86+0.14*Math.sin(tick*0.05+card.y*0.02);
    const cg=ctx.createLinearGradient(card.x,card.y,card.x,card.y+card.h);
    cg.addColorStop(0,p.acc+'26'); cg.addColorStop(1,'#0c0c14');
    rr(card.x,card.y,card.w,card.h,12); ctx.fillStyle=cg; ctx.fill();
    ctx.strokeStyle=p.ring; ctx.lineWidth=2; ctx.globalAlpha=pulse;
    rr(card.x,card.y,card.w,card.h,12); ctx.stroke(); ctx.globalAlpha=1;
    drawMenuIcon(g,card.x+card.w/2,card.y+52);
    ctx.font='9px "Press Start 2P"'; ctx.fillStyle=p.ring; ctx.textAlign='center';
    ctx.shadowColor=p.glow; ctx.shadowBlur=6;
    ctx.fillText(g.name,card.x+card.w/2,card.y+102);
    ctx.shadowBlur=0;
    ctx.font='5px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.fillText(g.tag,card.x+card.w/2,card.y+118);
    const bb=menuBests[g.id]||0;
    ctx.font='6px "Press Start 2P"'; ctx.fillStyle='#ffd24a';
    ctx.fillText(bb>0?'BEST '+bb:'NEW!',card.x+card.w/2,card.y+142);
  });
  // page indicator (only when there is more than one page)
  if(menuPageCount()>1){
    const nav=menuNav();
    nav.dots.forEach(d=>{
      ctx.beginPath(); ctx.arc(d.x,d.y,3,0,Math.PI*2);
      ctx.fillStyle=d.page===menuPage?'#ffd24a':'rgba(255,255,255,0.3)'; ctx.fill();
    });
    if(nav.left) drawArrow(nav.left,-1);
    if(nav.right) drawArrow(nav.right,1);
  }
  ctx.font='5px "Press Start 2P"'; ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.fillText('PAYMENTS BY CENTRAPAY',W/2,H-32);
  drawMark(W/2,H-17,14,'rgba(245,236,224,0.5)');
}

// ── Frame loop ───────────────────────────────────────────────────
function drawPauseOverlay(){
  ctx.fillStyle='rgba(4,2,8,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='12px "Press Start 2P"'; ctx.fillStyle='#fff';
  ctx.shadowColor=PALS[2].glow; ctx.shadowBlur=14;
  ctx.fillText('PAUSED',W/2,H/2-20); ctx.shadowBlur=0;
  ctx.globalAlpha=0.55+0.45*Math.sin(tick*0.08);
  ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#fff';
  ctx.fillText('► TAP TO RESUME',W/2,H/2+16);
  ctx.globalAlpha=1;
}
function frame(t){
  const dt=Math.min(0.05,(t-lastT)/1000||0.016);
  lastT=t;
  tick++;
  updateFX();
  if(mode==='game'&&cur){
    if(!paused) cur.update(dt);
    cur.render();
    if(paused) drawPauseOverlay();
    drawChrome(true);
  } else if(mode==='gauntlet'){
    if(!paused) GAUNTLET.update(dt);
    GAUNTLET.render();
    if(paused) drawPauseOverlay();
    drawChrome(true);
  } else {
    drawMenu();
    drawChrome(false);
  }
  requestAnimationFrame(frame);
}
// Freeze play when the tab is backgrounded; require a tap to resume on return.
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) return;
  if(mode==='game' && cur && cur.st==='play') paused=true;
  else if(mode==='gauntlet' && GAUNTLET.state==='playing' && cur && cur.st==='play') paused=true;
});

// ── Input ────────────────────────────────────────────────────────
function getXY(e){
  const r=c.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};
}
// Game input fires immediately on pointerdown (zero latency for rhythm taps).
// Menu selection resolves on pointerup so a horizontal drag reads as a page swipe.
let menuDrag=null;
function onDown(e){
  e.preventDefault();
  audio();
  const {x,y}=getXY(e);
  if(inR(x,y,muteRect())){ mute=!mute; try{ localStorage.setItem('arc_mute',mute?'1':'0'); }catch(err){} return; }
  if(mode==='game'){
    if(inR(x,y,homeRect())){ mode='menu'; cur.init(); cur=null; paused=false; refreshMenuBests(); return; }
    if(paused){ paused=false; return; } // consume the resume tap
    cur.tap(x,y);
    return;
  }
  if(mode==='gauntlet'){
    if(inR(x,y,homeRect())){ GAUNTLET.exit(); return; }
    if(paused){ paused=false; return; }
    GAUNTLET.tap(x,y);
    return;
  }
  menuDrag={x0:x,y0:y,moved:false}; // menu: defer to pointerup
}
function onMove(e){
  if(!menuDrag||mode!=='menu') return;
  if(Math.abs(getXY(e).x-menuDrag.x0)>8) menuDrag.moved=true;
}
function onUp(e){
  if(mode!=='menu'||!menuDrag){ menuDrag=null; return; }
  const {x,y}=getXY(e), dx=x-menuDrag.x0, moved=menuDrag.moved, n=menuPageCount();
  menuDrag=null;
  if(moved){ // swipe left/right between pages
    if(dx<=-40&&menuPage<n-1){ menuPage++; sTick(0.02); }
    else if(dx>=40&&menuPage>0){ menuPage--; sTick(0.02); }
    return;
  }
  const nav=menuNav();
  if(nav.left&&inR(x,y,nav.left)){ menuPage--; sTick(0.02); return; }
  if(nav.right&&inR(x,y,nav.right)){ menuPage++; sTick(0.02); return; }
  for(const d of nav.dots){ if(Math.hypot(x-d.x,y-d.y)<=d.r){ menuPage=d.page; sTick(0.02); return; } }
  for(const card of menuCards()){
    if(x>=card.x&&x<=card.x+card.w&&y>=card.y&&y<=card.y+card.h){
      if(card.g.isGauntlet){ GAUNTLET.begin(); sHit(); return; }
      cur=card.g; cur.onOver=null; cur.init(); mode='game'; paused=false; sHit(); return;
    }
  }
}
c.addEventListener('pointerdown',onDown);
c.addEventListener('pointermove',onMove);
c.addEventListener('pointerup',onUp);
c.addEventListener('pointercancel',()=>{ menuDrag=null; });
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(paused){ paused=false; return; }
    // Keyboard is convenience-only: route space only to positionless games.
    const inGame = mode==='game' || (mode==='gauntlet'&&GAUNTLET.state==='playing');
    if(inGame&&cur&&cur.spaceTap) cur.tap();
  } else if(mode==='menu'&&(e.code==='ArrowLeft'||e.code==='ArrowRight')){
    e.preventDefault();
    if(e.code==='ArrowLeft'&&menuPage>0) menuPage--;
    if(e.code==='ArrowRight'&&menuPage<menuPageCount()-1) menuPage++;
  }
});

// Wait for the pixel font before the first frame to kill the FOUT,
// but never block longer than the timeout fallback.
let loopStarted=false;
function startLoop(){ if(!loopStarted){ loopStarted=true; requestAnimationFrame(frame); } }
if(document.fonts&&document.fonts.load){
  Promise.race([
    document.fonts.load('8px "Press Start 2P"').catch(()=>{}),
    new Promise(r=>setTimeout(r,1500))
  ]).then(startLoop);
} else {
  startLoop();
}
</script>
